# Alembic configuration. The database URL is NOT stored here: migrations/env.py reads STATE_DB_URL
# (and PG_ENTRA_AUTH) from the application settings, so migrations use the same keyless connection as the app.
#
#   uv run alembic upgrade head          # apply (the rag-bootstrap job does this on deploy)
#   uv run alembic revision --autogenerate -m "add x"
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
