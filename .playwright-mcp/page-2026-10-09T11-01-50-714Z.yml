                - term [ref=f5e1074]: What it is
                - definition [ref=f5e1075]: Exactly one active profile pins the model, revision, dimensions and query / document prefixes, and both ingestion and query read it. The profile's fingerprint names the index. Changing the profile builds a new index alongside the old one, which keeps serving until the new one is ready. The options are self-hosted Qwen3-Embedding-0.6B on Hugging Face Text Embeddings Inference, or Azure OpenAI text-embedding-3-small (1536 dimensions). The self-hosted model is Apache-2.0, has 1024 or 512 dimensions, has no per-token cost, keeps text inside your deployment, and runs on a GPU pool that scales to zero.
                - term [ref=f5e1076]: Purpose
                - definition [ref=f5e1077]: "It prevents a common, silent cause of poor RAG quality: documents and questions embedded differently. It also supports data-residency needs."
                - term [ref=f5e1078]: Example
                - definition [ref=f5e1079]: When you move from Azure OpenAI to the self-hosted model, index B is built next to index A. Users query A until B is complete.
