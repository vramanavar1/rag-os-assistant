        - generic [ref=f5e1228]:
          - heading "6Where RAG-OS stands out" [level=2] [ref=f5e1229]
          - paragraph [ref=f5e1230]: These are the areas where RAG-OS adds something the Azure building blocks don't provide out of the box. "Not found" means we found no comparable feature in the Microsoft documentation and public competitor material we reviewed on 9 October 2026. It doesn't prove that none exists.
          - generic [ref=f5e1231]:
            - generic [ref=f5e1232]:
              - heading "Configurable ABAC, denied by default" [level=4] [ref=f5e1233]
              - paragraph [ref=f5e1234]: Department, region hierarchy, clearance level and personal share, combined in one declarative policy and compiled into a filter applied inside every search. Missing attributes mean deny-all, and claim values are allow-list validated, which makes filters injection-safe. Azure's native trimming is identity-based, with OR semantics. Among the competitors we profiled, we found none that advertises an equivalent policy model.
            - generic [ref=f5e1235]:
              - heading "Works alongside native ACLs" [level=4] [ref=f5e1236]
              - paragraph [ref=f5e1237]: "Azure AI Search appends its internal permission filter to any caller filter. That means source ACLs (for example SharePoint, through native ingestion) and the RAG-OS attribute policy can apply together: a document must pass both. RAG-OS covers corpora that have no trustworthy ACLs, and native ingestion covers those that do."
            - generic [ref=f5e1238]:
              - heading "Governed classification" [level=4] [ref=f5e1239]
              - paragraph [ref=f5e1240]: Layered tagging (rules, sidecars, Excel manifest, upload form, then classifiers), an SME review queue that freezes approved labels, and a recorded source for every facet. We found no comparable taxonomy, classification or review workflow in the Foundry IQ documentation. On Azure, custom enrichment also conflicts with native ACL and label ingestion within a single indexer pipeline.
            - generic [ref=f5e1241]:
              - heading "Abstain, don't guess" [level=4] [ref=f5e1242]
              - paragraph [ref=f5e1243]: RAG-OS refuses uncited answers. It abstains without calling the model when nothing permitted and relevant is found, and every refusal has a reason code. Admins can see why an answer was refused through the near-miss probe.
            - generic [ref=f5e1244]:
              - heading "Per-query token cost and stage tracing" [level=4] [ref=f5e1245]
              - paragraph [ref=f5e1246]: Token use is recorded on every answer, with one correlation ID across browser, API, queue and worker, and admins get stage-by-stage traces with replay. In Foundry IQ, token counts appear only in each response's activity log, and the MCP path drops activity and references entirely.
            - generic [ref=f5e1247]:
              - heading "Your choice of models, including Claude" [level=4] [ref=f5e1248]
              - paragraph [ref=f5e1249]: Claude on Microsoft Foundry or Azure OpenAI GPT can be the answer model. Embeddings can be self-hosted, with no per-token cost and text kept inside the deployment. Knowledge-base planning and synthesis in Foundry IQ accept Azure OpenAI models only.
            - generic [ref=f5e1250]:
              - heading "In your tenant, keyless" [level=4] [ref=f5e1251]
              - paragraph [ref=f5e1252]: RAG-OS runs in your Azure subscription with managed identity and no keys, and only entitled passages reach the model. Compared with SaaS assistants hosted outside Azure, this keeps the data path in your own tenant.
            - generic [ref=f5e1253]:
              - heading "A stable contract over fast-moving preview APIs" [level=4] [ref=f5e1254]
