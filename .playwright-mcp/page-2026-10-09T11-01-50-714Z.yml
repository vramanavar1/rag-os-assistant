          - paragraph [ref=f5e624]:
            - strong [ref=f5e625]: Where Azure is stronger.
            - text: Foundry IQ leads on agentic query planning and multi-source fan-out. It reaches Microsoft 365, SharePoint, OneLake and Work IQ first-hand. It gives every knowledge base a native MCP endpoint. It is a Microsoft-run service with nothing to operate, and it has a route to Purview labels and native ACLs. The first 50M agentic tokens each month are free, and Copilot Studio and Teams provide distribution. For a Microsoft 365 estate whose source permissions are already accurate, these are real advantages. RAG-OS plans to adopt them rather than rebuild them.
