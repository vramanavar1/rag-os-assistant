              - generic [ref=f5e975]:
                - term [ref=f5e976]: What it is
                - definition [ref=f5e977]: Keyword and vector search (50 candidates), reranked by the Azure AI Search semantic ranker. A minimum reranker score acts as a relevance bar, and the top 8 passages go to the model. Follow-up questions are rewritten as standalone questions, and taxonomy synonyms expand the query. Heading-aware chunking keeps tables and records intact.
                - term [ref=f5e978]: Purpose
                - definition [ref=f5e979]: Exact terms and paraphrases are both found, and fewer weak passages reach the model.
                - term [ref=f5e980]: Example
                - definition [ref=f5e981]: For "Can I carry over leave?", keyword matches on "carry over" and semantic matches on "unused annual leave rollover" are reranked together. A loosely related onboarding FAQ falls below the bar and is dropped.
