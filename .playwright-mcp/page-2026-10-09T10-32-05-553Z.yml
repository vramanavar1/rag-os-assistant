      - heading "4.2 How the ADLS Gen2 POSIX-like ACL model works in Azure AI Search" [level=3] [ref=f4e518]
      - paragraph [ref=f4e519]: This is the one native ACL path that fits customers whose file shares already sit in Data Lake Storage Gen2 with folder permissions. That is exactly the "file-share corpus" RAG-OS targets, so architects should understand it before we pick a SharePoint or ADLS design.
      - list [ref=f4e520]:
        - listitem [ref=f4e521]:
          - strong [ref=f4e522]: Storage model.
          - text: In a hierarchical-namespace account, each directory and file carries POSIX-like ACL entries that grant read, write or execute to named users and groups. Access ACLs apply to the item. Default ACLs are copied to
          - emphasis [ref=f4e523]: new
          - text: children only; existing children don't inherit new defaults. Azure RBAC is evaluated before ACLs, so an ACL can't take away access a role already grants.
        - listitem [ref=f4e524]:
          - strong [ref=f4e525]: Ingestion.
          - text: An ADLS Gen2 indexer (from
          - code [ref=f4e526]: 2025-05-01-preview
          - text: ) or a Blob knowledge source with
          - code [ref=f4e527]: isADLSGen2
          - text: (from
          - code [ref=f4e528]: 2025-11-01-preview
          - text: ) sets
          - code [ref=f4e529]: indexerPermissionOptions
          - text: /
          - code [ref=f4e530]: ingestionPermissionOptions
          - text: . It walks container root → each directory → file, computes the
          - emphasis [ref=f4e531]: effective
          - text: access list per file, and writes it to the
          - code [ref=f4e532]: userIds
          - text: and
          - code [ref=f4e533]: groupIds
          - text: fields (
          - code [ref=f4e534]: metadata_user_ids
          - text: ","
          - code [ref=f4e535]: metadata_group_ids
          - text: ). Container-level RBAC (Storage Blob Data Reader) goes into
          - code [ref=f4e536]: rbacScope
          - text: . When chunking, the ACL fields must be carried to each chunk with index projections.
        - listitem [ref=f4e537]:
          - strong [ref=f4e538]: Query.
          - text: The app sends its own credential in
          - code [ref=f4e539]: Authorization
          - text: and the user's Entra token (scope
          - code [ref=f4e540]: https://search.azure.com/.default
