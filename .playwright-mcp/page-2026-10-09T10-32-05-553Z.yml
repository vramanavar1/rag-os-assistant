    - generic [ref=f4e7]:
      - note [ref=f4e8]: Internal — not for distribution
      - paragraph [ref=f4e9]: Internal strategy review · v1.0 · 9 October 2026
      - 'heading "RAG-OS vs Azure: strategy review" [level=1] [ref=f4e10]'
      - paragraph [ref=f4e11]: A candid comparison of RAG-OS with Microsoft Foundry IQ and Azure AI Search document-level access. Every claim here is checked against the code as it stands, and the document names the course corrections to make before the market forces them.
      - list [ref=f4e12]:
        - listitem [ref=f4e13]: Audience Founder and architects
        - listitem [ref=f4e14]: Evidence Code inventory, Microsoft Learn and market scan, all checked 9 Oct 2026
        - listitem [ref=f4e15]:
          - text: Companion
          - code [ref=f4e16]: RAG-OS-FeatureComparison.html
          - text: (external edition)
      - list [ref=f4e17]:
        - listitem [ref=f4e18]:
          - generic [ref=f4e19]: Direction is right
          - text: Policy-based access and governed classification are real gaps that Azure's native features don't cover.
        - listitem [ref=f4e20]:
          - generic [ref=f4e21]: Claims need trimming
          - text: The Overview overstates "no per-token cost" embeddings (live dev runs Azure OpenAI 3-small) and leaves out admin tracing entirely.
        - listitem [ref=f4e22]:
          - generic [ref=f4e23]: Microsoft is closing in
          - text: Foundry IQ went GA in June 2026, and native ACL and Purview ingestion are in preview, all in the same Azure AI Search we run on.
        - listitem [ref=f4e24]:
          - generic [ref=f4e25]: Adopt, don't rebuild
          - text: Take SharePoint ACLs, OCR, Purview and quotas from Azure. Keep policy, classification, grounding and tracing custom.
    - generic [ref=f4e26]:
      - heading "1Verdict on one page" [level=2] [ref=f4e27]
      - paragraph [ref=f4e28]: RAG-OS is pointed at a real gap, but it is a narrower product today than the Overview implies. The platform underneath it (Azure AI Search) is moving toward governed RAG quickly. The plan should be to sit on top of Microsoft's stack, not compete with it.
      - list [ref=f4e29]:
        - listitem [ref=f4e30]:
          - strong [ref=f4e31]: The direction is broadly right.
          - text: "Policy-based access is the differentiator: department any-of, hierarchical region, clearance level and personal share, combined with default deny and compiled into a pre-filter that runs inside the search. Azure's native document-level access understands only"
          - code [ref=f4e32]: userIds
          - text: ","
          - code [ref=f4e33]: groupIds
          - text: ","
          - code [ref=f4e34]: rbacScope
          - text: and Purview labels. A match on any of them grants access, and there is no hierarchy or clearance logic. Microsoft's own guidance is to use security filters (the RAG-OS pattern) for custom policies. Layered classification with SME review and per-facet provenance has no counterpart in the Foundry IQ docs we reviewed. That is absence in the docs, not a Microsoft statement.
        - listitem [ref=f4e35]:
          - strong [ref=f4e36]: The product is narrower than it reads.
          - text: The working connectors are local folder, Blob and upload; SharePoint, Drive and FTP are stubs that raise
          - code [ref=f4e37]: NotSupported
          - text: . There is no OCR, only one retriever (
          - code [ref=f4e38]: direct
          - text: ), and only single-tenant Entra. Customer-portal context injection doesn't exist yet. The live dev deployment embeds with Azure OpenAI
          - code [ref=f4e39]: text-embedding-3-small
          - text: ", not the self-hosted TEI model the Overview leads with."
        - listitem [ref=f4e40]:
          - strong [ref=f4e41]: "Risk 1: Microsoft builds governed RAG into the same Azure AI Search."
          - text: Foundry IQ went GA on 2 June 2026 (narrow scope). Native SharePoint and ADLS ACL ingestion, Purview labels and a per-knowledge-base MCP endpoint are all shipping. Every quarter, the "AI Search plus a UI" part of RAG-OS gets cheaper for anyone to copy.
        - listitem [ref=f4e42]:
          - strong [ref=f4e43]: "Risk 2: seat prices have collapsed to about $20."
          - text: Copilot Business is $21, Gemini Business $21, Quick Plus $20, Onyx $20 (with a free open-source edition), and Rovo comes bundled. An SMB knowledge-base SaaS sold per seat can't win on features alone.
        - listitem [ref=f4e44]:
          - strong [ref=f4e45]: "Risk 3: the planned use cases are crowded."
          - text: Questionnaires have Vanta, Loopio and Responsive. Quizzes have Copilot in Microsoft Forms. Form filling has ONLYOFFICE and Nanonets. Cited finance grids have Hebbia.
        - listitem [ref=f4e46]:
          - strong [ref=f4e47]: "Top five moves:"
          - list [ref=f4e48]:
            - listitem [ref=f4e49]: "Correct the Overview this month: TEI wording, admin tracing, \"hosted on Foundry\", external portal users."
            - listitem [ref=f4e50]:
              - text: Ship SharePoint through Azure AI Search's native ACL ingestion as a
              - emphasis [ref=f4e51]: source-ACL mode
              - text: ANDed with RAG-OS policy, isolated behind an adapter. Don't build our own ACL sync.
            - listitem [ref=f4e52]: Move "governed retrieval as an MCP server" from Later to Next. The goal is to become the policy gateway for Copilot, Claude and Foundry agents rather than one more chat UI.
            - listitem [ref=f4e53]: Ship evaluation release gates with a faithfulness score, and OCR through Content Understanding. Both are entry tickets for regulated verticals.
            - listitem [ref=f4e54]: Lead with regulated-vertical completeness (mortgage loss-mitigation, then prior-auth and KYC) plus the governed enterprise knowledge base. Defer the personal edition, Drive/FTP and the marketplace, and drop "fun quizzes".
      - paragraph [ref=f4e56]:
        - strong [ref=f4e57]: "Internal positioning in one line:"
        - text: RAG-OS is the policy, classification and accountability layer
        - emphasis [ref=f4e58]: on top of
        - text: Azure AI Search and Foundry IQ, for documents whose source ACLs are missing or can't be trusted. It doesn't replace them.
