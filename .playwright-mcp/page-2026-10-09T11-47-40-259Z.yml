        - heading "How ADLS Gen2 POSIX-like ACLs become search permissions" [level=4] [ref=e929]
        - paragraph [ref=e930]:
          - text: ADLS Gen2 uses POSIX-style access control lists on folders and files. To read a file, a principal must be able to traverse every folder on its path and read the file itself. The Azure AI Search indexer follows this hierarchical evaluation from the container root down to each file. It writes the
          - strong [ref=e931]: final effective list of named users and groups
          - text: "into the index's permission fields. A simplified walk:"
        - list "Simplified effective access walk from container root to file" [ref=e932]:
          - listitem [ref=e933]:
            - generic [ref=e934]: / (container root)
            - text: HR-Team, Finance-Team, Payroll-Admins can traverse
          - generic [aria-hidden] [ref=e935]: →
          - listitem [ref=e936]:
            - generic [ref=e937]: /HR
            - text: HR-Team, Payroll-Admins
          - generic [aria-hidden] [ref=e938]: →
          - listitem [ref=e939]:
            - generic [ref=e940]: /HR/Payroll
            - text: Payroll-Admins
          - generic [aria-hidden] [ref=e941]: →
          - listitem [ref=e942]:
            - generic [ref=e943]: salary-bands.pdf
            - text: "read: Payroll-Admins"
          - generic [aria-hidden] [ref=e944]: →
          - listitem [ref=e945]:
            - generic [ref=e946]: groupIds = [Payroll-Admins]
            - text: effective access written to the index
        - list [ref=e947]:
          - listitem [ref=e948]:
            - strong [ref=e949]: Named users and groups only.
            - text: The owning user, owning group and "Other" entries aren't supported during the preview. Azure ABAC conditions aren't evaluated. Container RBAC is checked first, and a match on any mechanism grants access.
          - listitem [ref=e950]:
            - strong [ref=e951]: Entry limits.
            - text: ADLS Gen2 allows 32 ACL entries per file or folder (effectively 28). Entries beyond the limit might not be enforced at query time.
          - listitem [ref=e952]:
            - strong [ref=e953]: Permissions are a snapshot.
            - text: ACLs are captured on the first crawl and for new files. Later changes need a file touch,
            - code [ref=e954]: /resetdocs
            - text: or
            - code [ref=e955]: /resync
            - text: (Preview). Without one, the index keeps serving the old ACLs. Group membership, by contrast, is resolved live through Microsoft Graph, nested groups included.
          - listitem [ref=e956]:
            - strong [ref=e957]: Pipeline restrictions.
            - text: ACL ingestion doesn't work with the custom Web API skill, the enrichment cache, the knowledge store (so no image serving) or debug sessions. The Azure portal doesn't support it. If permission evaluation fails, the query returns a 5xx error (fails closed).
          - listitem [ref=e958]:
