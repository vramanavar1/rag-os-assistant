        - paragraph [ref=e1493]:
          - strong [ref=e1494]: Can both be used together?
          - text: Yes, for content indexed by Azure AI Search's built-in indexers (Blob, ADLS Gen2, SharePoint, OneLake), once native enforcement is GA. Azure AI Search ANDs the caller's own filter with its internal permission filter. A document then has to pass both the user's Purview usage rights and the RAG-OS access policy, so neither replaces the other. For content RAG-OS ingests itself, such as uploads and local folders, the label-to-policy mapping is the route.
