      - generic [ref=e1514]:
        - heading "7Where RAG-OS stands out" [level=2] [ref=e1515]
        - paragraph [ref=e1516]: These are the areas where RAG-OS adds something the Azure building blocks don't provide out of the box. "Not found" means we found no comparable feature in the Microsoft documentation and public competitor material we reviewed on 9 October 2026. It doesn't prove that none exists.
        - generic [ref=e1517]:
          - generic [ref=e1518]:
            - heading "Configurable ABAC, denied by default" [level=4] [ref=e1519]
            - paragraph [ref=e1520]: Department, region hierarchy, clearance level and personal share, combined in one declarative policy and compiled into a filter applied inside every search. Missing attributes mean deny-all, and claim values are allow-list validated, which makes filters injection-safe. Azure's native trimming is identity-based, with OR semantics. Among the competitors we profiled, we found none that advertises an equivalent policy model.
          - generic [ref=e1521]:
            - heading "Works alongside native ACLs" [level=4] [ref=e1522]
            - paragraph [ref=e1523]: "Azure AI Search appends its internal permission filter to any caller filter. That means source ACLs (for example SharePoint, through native ingestion) and the RAG-OS attribute policy can apply together: a document must pass both. RAG-OS covers corpora that have no trustworthy ACLs, and native ingestion covers those that do."
          - generic [ref=e1524]:
            - heading "Governed classification" [level=4] [ref=e1525]
            - paragraph [ref=e1526]: Layered tagging (rules, sidecars, Excel manifest, upload form, then classifiers), an SME review queue that freezes approved labels, and a recorded source for every facet. We found no comparable taxonomy, classification or review workflow in the Foundry IQ documentation. On Azure, custom enrichment also conflicts with native ACL and label ingestion within a single indexer pipeline.
          - generic [ref=e1527]:
            - heading "Abstain, don't guess" [level=4] [ref=e1528]
            - paragraph [ref=e1529]: RAG-OS refuses uncited answers. It abstains without calling the model when nothing permitted and relevant is found, and every refusal has a reason code. Admins can see why an answer was refused through the near-miss probe.
          - generic [ref=e1530]:
            - heading "Per-query token cost and stage tracing" [level=4] [ref=e1531]
            - paragraph [ref=e1532]: Token use is recorded on every answer, with one correlation ID across browser, API, queue and worker, and admins get stage-by-stage traces with replay. In Foundry IQ, token counts appear only in each response's activity log, and the MCP path drops activity and references entirely.
          - generic [ref=e1533]:
            - heading "Your choice of models, including Claude" [level=4] [ref=e1534]
            - paragraph [ref=e1535]: Claude on Microsoft Foundry or Azure OpenAI GPT can be the answer model. Embeddings can be self-hosted, with no per-token cost and text kept inside the deployment. Knowledge-base planning and synthesis in Foundry IQ accept Azure OpenAI models only.
          - generic [ref=e1536]:
            - heading "In your tenant, keyless" [level=4] [ref=e1537]
            - paragraph [ref=e1538]: RAG-OS runs in your Azure subscription with managed identity and no keys, and only entitled passages reach the model. Compared with SaaS assistants hosted outside Azure, this keeps the data path in your own tenant.
          - generic [ref=e1539]:
            - heading "A stable contract over fast-moving preview APIs" [level=4] [ref=e1540]
            - paragraph [ref=e1541]: Foundry IQ's governance features (permission ingestion, Purview labels, SharePoint, planning) are in Preview, and the API has changed rapidly. RAG-OS offers customers one stable product contract, and adopts the native features underneath as they mature.
        - heading "7.1 Current gaps and how the roadmap closes them" [level=3] [ref=e1542]
        - paragraph [ref=e1543]:
          - text: RAG-OS doesn't yet cover everything an enterprise knowledge platform may need. The table lists what is not available today, why it matters, the roadmap phase that addresses it (see
          - link "section 9" [ref=e1544] [cursor=pointer]:
            - /url: "#s-roadmap"
          - text: ), and the Azure building block RAG-OS plans to use where one exists. On narrow screens, the table scrolls sideways.
