          - text: Labels become an
          - strong [ref=e1340]: input to classification
          - text: ", not a second access engine. One access policy stays the single place where access is decided."
        - list [ref=e1341]:
          - listitem [ref=e1342]:
            - strong [ref=e1343]: Read the label at ingestion.
            - text: Word, Excel and PowerPoint files keep label metadata either in custom document properties (
            - code [ref=e1344]: MSIP_Label_…
            - text: ) or, in tenants that turn on co-authoring for labelled files, in the newer
            - code [ref=e1345]: LabelInfo.xml
            - text: format. Microsoft notes that once co-authoring is on, new label information is no longer written to the custom properties, so RAG-OS will read both. For SharePoint and OneDrive content, the Microsoft Graph
            - code [ref=e1346]: extractSensitivityLabels
            - text: action (v1.0,
            - code [ref=e1347]: Files.Read.All
            - text: ) returns the label. Label IDs are resolved to a name and priority through the Graph sensitivity label API (v1.0,
            - code [ref=e1348]: SensitivityLabel.Read
            - text: ).
          - listitem [ref=e1349]:
            - strong [ref=e1350]: Map it through a customer-reviewed table.
            - text: Each label maps to a RAG-OS
            - strong [ref=e1351]: clearance level
            - text: and a
            - strong [ref=e1352]: confidentiality
            - text: "facet value. The mapping is an explicit table that the customer approves, not an automatic ranking: Microsoft says a higher label priority"
            - emphasis [ref=e1353]: usually
            - text: means higher sensitivity, which is not a guarantee.
          - listitem [ref=e1354]:
            - strong [ref=e1355]: Record provenance, allow SME override.
            - text: The tag records that it came from a Purview label, as every RAG-OS facet records its source. An SME can review and override it, and an approved review is never overwritten by a later rule.
          - listitem [ref=e1356]:
            - strong [ref=e1357]: Enforce through the single access policy.
            - text: The clearance level joins department, region and personal-share rules in the same filter inside Azure AI Search. A document without a clearance level is denied, so an unmapped label withholds the document rather than exposing it.
          - listitem [ref=e1358]:
            - strong [ref=e1359]: Show labels in answers.
            - text: Each citation shows its source's label badge, and the answer carries the highest-priority label among its sources. Microsoft 365 Copilot behaves the same way, so users see what they already expect.
          - listitem [ref=e1360]:
            - strong [ref=e1361]: "Optional: keep selected labels away from the model."
            - text: A configurable rule can mark labels whose content is never sent to the LLM. Such documents can be cited or excluded, but not summarised.
          - listitem [ref=e1362]:
            - strong [ref=e1363]: Encrypted (rights-protected) files.
            - text: General-purpose parsers can't read encrypted content, but the label metadata can still be read. RAG-OS will record these files with their label and report them in the admin console. Content is decrypted only if the customer approves a Microsoft Information Protection (MIP) SDK setup. Decryption needs an identity with super-user rights over the tenant's encrypted content, so it is a governance decision for the customer.
