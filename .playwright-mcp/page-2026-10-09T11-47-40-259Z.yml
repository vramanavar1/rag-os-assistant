        - heading "Key takeaways" [level=3] [ref=e116]
        - list [ref=e117]:
          - listitem [ref=e118]:
            - strong [ref=e119]: Different layers, not substitutes.
            - text: Foundry IQ and AI Search retrieve content and trim results by identity. RAG-OS sits above them and decides
            - emphasis [ref=e120]: who should see what
            - text: ","
            - emphasis [ref=e121]: how documents are classified
            - text: and
            - emphasis [ref=e122]: when not to answer
            - text: .
          - listitem [ref=e123]:
            - strong [ref=e124]: Identity trimming versus policy.
            - text: Azure's native access matches users, groups, RBAC scope, SharePoint groups and Purview labels, and a match on any one grants access. It has no hierarchy or clearance logic. RAG-OS compiles department, region hierarchy, clearance and personal-share rules into a filter applied inside every search, and denies access by default. Azure ANDs a caller's filter with its own permission filter, so the two can be combined.
          - listitem [ref=e125]:
            - strong [ref=e126]: Classification is the open space.
            - text: The Foundry IQ documentation we reviewed has no taxonomy authoring, document classification or human review queue. RAG-OS provides layered tagging, cost-capped auto-classification, an SME review queue and a source recorded for every tag.
          - listitem [ref=e127]:
            - strong [ref=e128]: Azure is stronger in several areas, and this document says so.
            - text: Those areas are agentic query planning and multi-source fan-out, first-party Microsoft 365 / SharePoint / OneLake reach, a native MCP endpoint for every knowledge base, a Microsoft-run service with no app to operate, a route to Purview labels and native ACLs, and the first 50M agentic tokens free each month.
          - listitem [ref=e129]:
            - strong [ref=e130]: Maturity matters for governance.
            - text: "Document-level permissions in Foundry IQ are Preview only: they aren't in the stable 2026-04-01 API. Microsoft's documentation also describes cases where knowledge-base retrieval returns"
            - emphasis [ref=e131]: unfiltered
            - text: results, for example when the user token is omitted. The APIs are changing fast. RAG-OS gives customers a stable product contract and can adopt these native features as they reach GA.
          - listitem [ref=e132]:
            - strong [ref=e133]: The roadmap is built to work together with Azure.
            - text: Planned work includes SharePoint through native ACL ingestion, Foundry IQ as an alternative retriever, Purview labels mapped to clearance levels, RAG-OS as an MCP server, and publishing as a Foundry agent for Teams and Copilot Studio.
