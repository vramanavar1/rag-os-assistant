        - heading "10.1 Other considerations for evaluators" [level=3] [ref=e1824]
        - list [ref=e1825]:
          - listitem [ref=e1826]:
            - strong [ref=e1827]: Total cost of ownership.
            - text: RAG-OS costs are Azure resources in your subscription plus LLM tokens, rather than a per-seat SaaS fee. RAG-OS reports the tokens used for every answer, so you can model cost from a pilot's real usage.
          - listitem [ref=e1828]:
            - strong [ref=e1829]: Security review of the access path.
            - text: Ask for a threat model covering sign-in, the embed, attribute claims, filter construction and admin bypass, and review it with your security team.
          - listitem [ref=e1830]:
            - strong [ref=e1831]: Evaluate on your own golden questions.
            - text: "Build a set of questions with expected answers and citations from your own documents. Include access-leak tests: users who must"
            - emphasis [ref=e1832]: not
            - text: see a document should get an abstention, not an answer.
          - listitem [ref=e1833]:
            - strong [ref=e1834]: Side-by-side pilot.
            - text: Agree a short demo script and run the same questions, users and documents through each option you are considering.
          - listitem [ref=e1835]:
            - strong [ref=e1836]: Data residency and model choice.
            - text: Confirm the regions for search, storage and models, and which models (Claude or Azure OpenAI GPT, self-hosted or Azure OpenAI embeddings) meet your policies.
          - listitem [ref=e1837]:
            - strong [ref=e1838]: Preview-feature risk on the Azure side.
            - text: Several native governance features are in Preview, with no SLA and changing APIs. Check their status on the linked pages before you depend on them.
