    - main [ref=e70]:
      - generic [ref=e71]:
        - paragraph [ref=e72]: Competitive analysis · v1.0 · 9 October 2026
        - heading "RAG-OS vs Azure Foundry IQ & AI Search" [level=1] [ref=e73]
        - paragraph [ref=e74]: What Microsoft's platform building blocks provide, what RAG-OS adds on top of them, and how the two work together. The comparison is dated, because preview features change quickly.
        - list [ref=e75]:
          - listitem [ref=e76]: Version 1.0
          - listitem [ref=e77]: Date 9 October 2026
          - listitem [ref=e78]: Audience Prospects and partners
          - listitem [ref=e79]: Azure status checked 9 October 2026
        - list [ref=e80]:
          - listitem [ref=e81]:
            - generic [ref=e82]: Policy-based access
            - text: Department, region hierarchy, clearance and personal shares, enforced inside every search. Access is denied by default.
          - listitem [ref=e83]:
            - generic [ref=e84]: Governed classification
            - text: Layered tagging, an SME review queue and a record of where every tag came from.
          - listitem [ref=e85]:
            - generic [ref=e86]: Grounded answers
            - text: Page-level citations, and an abstention when the permitted evidence doesn't support an answer.
          - listitem [ref=e87]:
            - generic [ref=e88]: Runs in your tenant
            - text: Your Azure subscription, keyless managed identity, and models on Microsoft Foundry.
      - generic [ref=e89]:
