    - generic [ref=f1e29]:
      - paragraph [ref=f1e30]: Competitive analysis · v1.0 · 9 October 2026
      - heading "RAG-OS vs Azure Foundry IQ & AI Search" [level=1] [ref=f1e31]
      - paragraph [ref=f1e32]: What Microsoft's platform building blocks provide, what RAG-OS adds on top of them, and how the two work together. The comparison is dated, because preview features change quickly.
      - list [ref=f1e33]:
        - listitem [ref=f1e34]: Version 1.0
        - listitem [ref=f1e35]: Date 9 October 2026
        - listitem [ref=f1e36]: Audience Prospects and partners
        - listitem [ref=f1e37]: Azure status checked 9 October 2026
      - list [ref=f1e38]:
        - listitem [ref=f1e39]:
          - generic [ref=f1e40]: Policy-based access
          - text: Department, region hierarchy, clearance and personal shares, enforced inside every search. Access is denied by default.
        - listitem [ref=f1e41]:
          - generic [ref=f1e42]: Governed classification
          - text: Layered tagging, an SME review queue and a record of where every tag came from.
        - listitem [ref=f1e43]:
          - generic [ref=f1e44]: Grounded answers
          - text: Page-level citations, and an abstention when the permitted evidence doesn't support an answer.
        - listitem [ref=f1e45]:
          - generic [ref=f1e46]: Runs in your tenant
          - text: Your Azure subscription, keyless managed identity, and models on Microsoft Foundry.
