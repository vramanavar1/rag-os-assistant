      - heading "RAG-OS vs Azure Foundry IQ & AI Search" [level=1] [ref=f4e31]
      - paragraph [ref=f4e32]: What Microsoft's platform building blocks provide, what RAG-OS adds on top of them, and how the two work together. The comparison is dated, because preview features change quickly.
      - list [ref=f4e33]:
        - listitem [ref=f4e34]: Version 1.0
        - listitem [ref=f4e35]: Date 9 October 2026
        - listitem [ref=f4e36]: Audience Prospects and partners
        - listitem [ref=f4e37]: Azure status checked 9 October 2026
      - list [ref=f4e38]:
        - listitem [ref=f4e39]:
          - generic [ref=f4e40]: Policy-based access
          - text: Department, region hierarchy, clearance and personal shares, enforced inside every search. Access is denied by default.
        - listitem [ref=f4e41]:
          - generic [ref=f4e42]: Governed classification
          - text: Layered tagging, an SME review queue and a record of where every tag came from.
        - listitem [ref=f4e43]:
          - generic [ref=f4e44]: Grounded answers
          - text: Page-level citations, and an abstention when the permitted evidence doesn't support an answer.
        - listitem [ref=f4e45]:
          - generic [ref=f4e46]: Runs in your tenant
          - text: Your Azure subscription, keyless managed identity, and models on Microsoft Foundry.
