# Ingestion source INSTANCES. Many instances of the same type are allowed; each gets its own schedule,
# queue lane and classification/ACL defaults. Types come from the source factory registry
# (`rag-os sources` lists them). Secrets are referenced as kv://<secret-name> (Azure Key Vault).
version: 1
sources:
  # Sample corpus shipped with the repo (local folder). In Azure run discovery from a machine that has the
  # folder:  uv run rag-os discover --source sample-corpus
  - id: sample-corpus
    type: local_folder
    domain: enterprise
    lane: bulk
    schedule: null                    # manual / CLI
    settings:
      root: ./samples/corpus
      include: ["**/*"]
    defaults:
      facets: { language: en }
      acl: { clearance: 1 }

  # Conflict-handling demonstration: two handbooks that disagree about the same entitlement, so a question
  # about it retrieves both. Kept as two SOURCES rather than two files, because the point being shown is a
  # disagreement between systems of record - the citations name different origins. Both are manual (no
  # schedule), so `./tasks.ps1 seed` does not put contradictory documents in anyone's index by accident:
  #   rag-os discover --source scenario-global-handbook
  #   rag-os discover --source scenario-uk-handbook
  # See "User Query Handling Scenarios" in README.md. The paths under each root follow the usual
  # &lt;department&gt;/&lt;region&gt;/&lt;doc_type&gt;/ layout, so the shipped path rules tag them with no extra configuration.
  - id: scenario-global-handbook
    type: local_folder
    domain: enterprise
    lane: bulk
    schedule: null
    settings:
      root: ./samples/scenarios/global-handbook
    defaults:
      facets: { language: en }
      acl: { clearance: 1 }

  - id: scenario-uk-handbook
    type: local_folder
    domain: enterprise
    lane: bulk
    schedule: null
    settings:
      root: ./samples/scenarios/uk-handbook
    defaults:
      facets: { language: en }
      acl: { clearance: 1 }

  # Synthetic corpus for the load test (scripts/loadtest.py generate --out samples/synthetic).
  - id: synthetic-load
    type: local_folder
    domain: enterprise
    lane: bulk
    settings:
      root: ./samples/synthetic
    defaults:
      facets: { language: en }
      acl: { clearance: 1 }

  # Documents uploaded through the API / chat UI (priority lane - never waits behind backfills).
  - id: uploads
    type: upload
    domain: enterprise
    lane: priority
    full_listing: false
    settings:
      allowed_roles: [admin, contributor]
    defaults:
      # No language default on purpose. There is no language detection in the pipeline, so a default here is an
      # assertion about content nobody checked - it labelled every German and Hindi upload English. The uploader
      # picks it instead, and an unset facet is honest where a wrong one is not. (The crawled sources below keep
      # theirs: those are corpora we control.)
      acl: { clearance: 1 }

  # Bulk store in Azure Blob Storage, synced every 30 minutes by the scheduler job.
  - id: knowledge-blob
    type: azure_blob
    enabled: false                    # enable after creating the container
    domain: enterprise
    lane: bulk
    schedule: "*/30 * * * *"
    settings:
      container: knowledge
      prefix: ""
    defaults:
      facets: { language: en }
      acl: { clearance: 1 }

  # Planned connectors (registered types; configuration validated now, sync raises "not implemented").
  - id: finance-sharepoint
    type: sharepoint
    enabled: false
    settings:
      site_url: https://contoso.sharepoint.com/sites/finance
      library: Documents
      client_secret: kv://sharepoint-client-secret
    defaults:
      facets: { department: Finance }
      acl: { department: [Finance], region: ["*"] }

  - id: partner-sftp
    type: ftp
    enabled: false
    settings:
      host: sftp.partner.example
      username: rag-os
      private_key: kv://partner-sftp-key
    defaults:
      facets: { doc_type: [RateCard] }
