<svg class="ragos-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1004" width="1440" height="1004" preserveAspectRatio="xMidYMid meet" role="img" aria-label="How a person's token claims become the access filter applied inside every search"><title>How a person's token claims become the access filter applied inside every search</title><style>
  svg.ragos-diagram{
    --d-bg:#ffffff; --d-lane:#f8fafc; --d-lane-br:#e2e8f0; --d-lane-tx:#475569;
    --d-query-bg:#eef2ff; --d-query-br:#6366f1; --d-query-tx:#312e81;
    --d-ingest-bg:#fff7ed; --d-ingest-br:#f59e0b; --d-ingest-tx:#92400e;
    --d-data-bg:#f1f5f9; --d-data-br:#64748b; --d-data-tx:#1e293b;
    --d-ai-bg:#f5f3ff; --d-ai-br:#8b5cf6; --d-ai-tx:#5b21b6;
    --d-sec-bg:#ecfdf5; --d-sec-br:#10b981; --d-sec-tx:#065f46;
    --d-obs-bg:#f8fafc; --d-obs-br:#94a3b8; --d-obs-tx:#334155;
    --d-ext-bg:#ffffff; --d-ext-br:#0f172a; --d-ext-tx:#0f172a;
    --d-state-bg:#ffffff; --d-state-br:#334155; --d-state-tx:#0f172a;
    --d-bad-bg:#fef2f2; --d-bad-br:#ef4444; --d-bad-tx:#991b1b;
    --d-text:#0f172a; --d-muted:#475569; --d-edge:#64748b; --d-edge-tx:#334155;
    --d-chip:#ffffff; --d-badge:#0f172a; --d-badge-tx:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    svg.ragos-diagram{
      --d-bg:#0f172a; --d-lane:#111c33; --d-lane-br:#2a3a56; --d-lane-tx:#94a3b8;
      --d-query-bg:#1e1b4b; --d-query-br:#818cf8; --d-query-tx:#c7d2fe;
      --d-ingest-bg:#3b2a0c; --d-ingest-br:#fbbf24; --d-ingest-tx:#fde68a;
      --d-data-bg:#1c2942; --d-data-br:#94a3b8; --d-data-tx:#e2e8f0;
      --d-ai-bg:#2e1065; --d-ai-br:#a78bfa; --d-ai-tx:#ddd6fe;
      --d-sec-bg:#052e26; --d-sec-br:#34d399; --d-sec-tx:#a7f3d0;
      --d-obs-bg:#172033; --d-obs-br:#94a3b8; --d-obs-tx:#cbd5e1;
      --d-ext-bg:#0b1220; --d-ext-br:#cbd5e1; --d-ext-tx:#e2e8f0;
      --d-state-bg:#111c33; --d-state-br:#94a3b8; --d-state-tx:#e2e8f0;
      --d-bad-bg:#3f1d1d; --d-bad-br:#f87171; --d-bad-tx:#fecaca;
      --d-text:#e2e8f0; --d-muted:#94a3b8; --d-edge:#94a3b8; --d-edge-tx:#cbd5e1;
      --d-chip:#0f172a; --d-badge:#e2e8f0; --d-badge-tx:#0f172a;
    }
  }
  svg.ragos-diagram text{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  svg.ragos-diagram .t-title{font-size:15px;font-weight:650;}
  svg.ragos-diagram .t-line{font-size:12.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-small{font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-lane{font-size:12.5px;font-weight:700;letter-spacing:.06em;fill:var(--d-lane-tx);}
  svg.ragos-diagram .t-edge{font-size:12px;fill:var(--d-edge-tx);}
  svg.ragos-diagram .t-badge{font-size:11.5px;font-weight:700;fill:var(--d-badge-tx);}
  svg.ragos-diagram .t-head{font-size:17px;font-weight:700;fill:var(--d-text);}
  svg.ragos-diagram .edge{fill:none;stroke:var(--d-edge);stroke-width:1.7;}
  svg.ragos-diagram .edge-dash{fill:none;stroke:var(--d-edge);stroke-width:1.5;stroke-dasharray:6 5;}
  svg.ragos-diagram .lane{fill:var(--d-lane);stroke:var(--d-lane-br);stroke-width:1.5;}
  svg.ragos-diagram .chip{fill:var(--d-chip);stroke:var(--d-lane-br);stroke-width:1;}
  svg.ragos-diagram .t-code{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:12.5px;fill:var(--d-text);}
  svg.ragos-diagram .t-codesm{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .lifeline{stroke:var(--d-edge);stroke-width:1.6;stroke-dasharray:5 5;}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker></defs><rect width="1440" height="1004" fill="var(--d-bg)"/><text class="t-head" x="36" y="44" text-anchor="start">How a person's attributes become a search filter</text><text class="t-small" x="36" y="64">Worked example: Priya — HR, United Kingdom, clearance 1, employee id E1001, signed in with Entra ID. Adding an attribute is a YAML edit; none of this is hard-coded.</text><text class="t-small" x="36" y="86" font-weight="700">Three names for one idea: (1) the CLAIM Entra sends about the person, (2) the ATTRIBUTE the policy calls it, (3) the acl_* INDEX FIELD on the document. Nothing named acl_* is ever a claim.</text><rect x="40" y="132" width="286" height="132" rx="10" fill="var(--d-ext-bg)" stroke="var(--d-ext-br)" stroke-width="1.6"/><text class="t-title" x="183.0" y="159.0" text-anchor="middle" fill="var(--d-ext-tx)">1 · Token claims</text><text class="t-line" x="183.0" y="182.0" text-anchor="middle">extn.department: ["HR"]</text><text class="t-line" x="183.0" y="199.0" text-anchor="middle">extn.region: ["UK"]</text><text class="t-line" x="183.0" y="216.0" text-anchor="middle">extn.clearance: 1</text><text class="t-line" x="183.0" y="233.0" text-anchor="middle">oid: "E1001"</text><text class="t-line" x="183.0" y="250.0" text-anchor="middle">roles: ["rag.sme"]</text><rect x="372" y="132" width="266" height="132" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="505.0" y="159.0" text-anchor="middle" fill="var(--d-sec-tx)">2 · ClaimsMapper</text><text class="t-line" x="505.0" y="182.0" text-anchor="middle">maps each claim to an</text><text class="t-line" x="505.0" y="199.0" text-anchor="middle">attribute, per issuer</text><text class="t-line" x="505.0" y="216.0" text-anchor="middle">(entra · dev)</text><text class="t-line" x="505.0" y="233.0" text-anchor="middle">value_map turns a group</text><text class="t-line" x="505.0" y="250.0" text-anchor="middle">object id into a value</text><rect x="684" y="132" width="286" height="132" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="827.0" y="159.0" text-anchor="middle" fill="var(--d-sec-tx)">3 · Principal attributes</text><text class="t-line" x="827.0" y="182.0" text-anchor="middle">department = [HR]</text><text class="t-line" x="827.0" y="199.0" text-anchor="middle">region = [UK]</text><text class="t-line" x="827.0" y="216.0" text-anchor="middle">clearance = 1</text><text class="t-line" x="827.0" y="233.0" text-anchor="middle">employee_id = [E1001]</text><text class="t-line" x="827.0" y="250.0" text-anchor="middle">roles = {reviewer}</text><rect x="1016" y="132" width="388" height="132" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="1210.0" y="159.0" text-anchor="middle" fill="var(--d-sec-tx)">4 · AccessPolicyEngine</text><text class="t-line" x="1210.0" y="182.0" text-anchor="middle">every value is checked against</text><text class="t-line" x="1210.0" y="199.0" text-anchor="middle">its allow-list pattern first —</text><text class="t-line" x="1210.0" y="216.0" text-anchor="middle">a bad value is a 401, never a</text><text class="t-line" x="1210.0" y="233.0" text-anchor="middle">sanitised filter</text><text class="t-line" x="1210.0" y="250.0" text-anchor="middle">(this is what blocks injection)</text><path class="edge" d="M326 198.0 L372 198.0" marker-end="url(#arrow)"/><path class="edge" d="M638 198.0 L684 198.0" marker-end="url(#arrow)"/><path class="edge" d="M970 198.0 L1016 198.0" marker-end="url(#arrow)"/><text class="t-small" x="183.0" y="294" text-anchor="middle" font-weight="700">(1) claim names — configured in Entra</text><text class="t-small" x="827.0" y="294" text-anchor="middle" font-weight="700">(2) attribute names — `name:` in the policy</text><rect class="lane" x="40" y="322" width="1364" height="244" rx="14"/><text class="t-lane" x="58" y="346">MATCH RULES</text><text class="t-small" x="58" y="364">(3) index fields (acl_*) describe the DOCUMENT — declared as `field:` in access-policy.yaml</text><rect x="62" y="380" width="316" height="115" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="220.0" y="407.0" text-anchor="middle" fill="var(--d-data-tx)">any_of   ·   department</text><text class="t-line" x="220.0" y="430.0" text-anchor="middle">field acl_department</text><text class="t-line" x="220.0" y="447.0" text-anchor="middle">caller has any value the document</text><text class="t-line" x="220.0" y="464.0" text-anchor="middle">allows; a document value of *</text><text class="t-line" x="220.0" y="481.0" text-anchor="middle">means everyone</text><text class="t-codesm" x="220.0" y="519" text-anchor="middle">search.in(v, 'HR|*', '|')</text><rect x="396" y="380" width="316" height="115" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="554.0" y="407.0" text-anchor="middle" fill="var(--d-data-tx)">hierarchical   ·   region</text><text class="t-line" x="554.0" y="430.0" text-anchor="middle">field acl_region</text><text class="t-line" x="554.0" y="447.0" text-anchor="middle">the caller's value is expanded to its</text><text class="t-line" x="554.0" y="464.0" text-anchor="middle">ancestors, so UK also sees EMEA</text><text class="t-line" x="554.0" y="481.0" text-anchor="middle">and Global</text><text class="t-codesm" x="554.0" y="519" text-anchor="middle">search.in(v, 'UK|EMEA|Global|*', '|')</text><rect x="730" y="380" width="316" height="115" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="888.0" y="407.0" text-anchor="middle" fill="var(--d-data-tx)">max_level   ·   clearance</text><text class="t-line" x="888.0" y="430.0" text-anchor="middle">field acl_clearance</text><text class="t-line" x="888.0" y="447.0" text-anchor="middle">the document's level must be at or</text><text class="t-line" x="888.0" y="464.0" text-anchor="middle">below the caller's; a document</text><text class="t-line" x="888.0" y="481.0" text-anchor="middle">with no level is denied</text><text class="t-codesm" x="888.0" y="519" text-anchor="middle">acl_clearance le 1</text><rect x="1064" y="380" width="316" height="115" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="1222.0" y="407.0" text-anchor="middle" fill="var(--d-data-tx)">exact   ·   employee_id</text><text class="t-line" x="1222.0" y="430.0" text-anchor="middle">field acl_employee_id</text><text class="t-line" x="1222.0" y="447.0" text-anchor="middle">explicit share with one person;</text><text class="t-line" x="1222.0" y="464.0" text-anchor="middle">the * wildcard is never honoured</text><text class="t-line" x="1222.0" y="481.0" text-anchor="middle">for a grant</text><text class="t-codesm" x="1222.0" y="519" text-anchor="middle">search.in(v, 'E1001', '|')</text><rect x="40" y="600" width="1364" height="81" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="722.0" y="627.0" text-anchor="middle" fill="var(--d-sec-tx)">combine:   all_of = AND   ·   grant_any_of = OR</text><text class="t-line" x="722.0" y="650.0" text-anchor="middle">(department AND region AND clearance)   OR   (employee_id)</text><text class="t-line" x="722.0" y="667.0" text-anchor="middle">a grant stands alone: it still applies when a required all_of attribute is missing</text><path class="edge" d="M1210.0 264 L1210.0 322" marker-end="url(#arrow)"/><path class="edge" d="M722.0 566 L722.0 600" marker-end="url(#arrow)"/><rect x="40" y="710" width="1364" height="112" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-small" x="60" y="734" font-weight="700">The filter sent to Azure AI Search with every search, facet and listing call — rag-os explain prints exactly this</text><text class="t-code" x="60" y="762">(acl_department/any(v: search.in(v, 'HR|*', '|')) and acl_region/any(v: search.in(v, 'UK|EMEA|Global|*', '|'))</text><text class="t-code" x="60" y="782"> and acl_clearance le 1)</text><text class="t-code" x="60" y="802">or (acl_employee_id/any(v: search.in(v, 'E1001', '|')))</text><path class="edge" d="M722.0 681 L722.0 710" marker-end="url(#arrow)"/><rect x="40" y="848" width="430" height="81" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="255.0" y="875.0" text-anchor="middle" fill="var(--d-sec-tx)">Document is returned</text><text class="t-line" x="255.0" y="898.0" text-anchor="middle">every all_of attribute allows this caller,</text><text class="t-line" x="255.0" y="915.0" text-anchor="middle">or an explicit grant matches</text><rect x="504" y="848" width="436" height="81" rx="10" fill="var(--d-bad-bg)" stroke="var(--d-bad-br)" stroke-width="1.6"/><text class="t-title" x="722.0" y="875.0" text-anchor="middle" fill="var(--d-bad-tx)">Default deny</text><text class="t-line" x="722.0" y="898.0" text-anchor="middle">untagged document, or every branch failed</text><text class="t-line" x="722.0" y="915.0" text-anchor="middle">→ DENY_ALL, the search never runs</text><rect x="974" y="848" width="430" height="81" rx="10" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.6"/><text class="t-title" x="1189.0" y="875.0" text-anchor="middle" fill="var(--d-obs-tx)">Admin bypass</text><text class="t-line" x="1189.0" y="898.0" text-anchor="middle">Entra app role rag.admin only — never from an</text><text class="t-line" x="1189.0" y="915.0" text-anchor="middle">untrusted issuer — and always audit-logged</text><path class="edge" d="M255.0 822 L255.0 848" marker-end="url(#arrow)"/><path class="edge" d="M722.0 822 L722.0 848" marker-end="url(#arrow)"/><path class="edge" d="M1189.0 822 L1189.0 848" marker-end="url(#arrow)"/><text class="t-small" x="36" y="986">A property test generates random principals and documents and checks that this OData filter and the Python predicate used by the local index always agree — so what you test offline is what Azure enforces.</text></svg>