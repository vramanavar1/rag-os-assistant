<svg class="ragos-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" width="1440" height="1010" preserveAspectRatio="xMidYMid meet" role="img" aria-label="What RAG-OS reads from a document when it classifies it"><title>What RAG-OS reads from a document when it classifies it</title><style>
  svg.ragos-diagram{
    --d-bg:#ffffff; --d-lane:#f8fafc; --d-lane-br:#e2e8f0; --d-lane-tx:#475569;
    --d-query-bg:#eef2ff; --d-query-br:#6366f1; --d-query-tx:#312e81;
    --d-ingest-bg:#fff7ed; --d-ingest-br:#f59e0b; --d-ingest-tx:#92400e;
    --d-data-bg:#f1f5f9; --d-data-br:#64748b; --d-data-tx:#1e293b;
    --d-ai-bg:#f5f3ff; --d-ai-br:#8b5cf6; --d-ai-tx:#5b21b6;
    --d-sec-bg:#ecfdf5; --d-sec-br:#10b981; --d-sec-tx:#065f46;
    --d-obs-bg:#f8fafc; --d-obs-br:#94a3b8; --d-obs-tx:#334155;
    --d-ext-bg:#ffffff; --d-ext-br:#0f172a; --d-ext-tx:#0f172a;
    --d-state-bg:#ffffff; --d-state-br:#334155; --d-state-tx:#0f172a;
    --d-bad-bg:#fef2f2; --d-bad-br:#ef4444; --d-bad-tx:#991b1b;
    --d-text:#0f172a; --d-muted:#475569; --d-edge:#64748b; --d-edge-tx:#334155;
    --d-chip:#ffffff; --d-badge:#0f172a; --d-badge-tx:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    svg.ragos-diagram{
      --d-bg:#0f172a; --d-lane:#111c33; --d-lane-br:#2a3a56; --d-lane-tx:#94a3b8;
      --d-query-bg:#1e1b4b; --d-query-br:#818cf8; --d-query-tx:#c7d2fe;
      --d-ingest-bg:#3b2a0c; --d-ingest-br:#fbbf24; --d-ingest-tx:#fde68a;
      --d-data-bg:#1c2942; --d-data-br:#94a3b8; --d-data-tx:#e2e8f0;
      --d-ai-bg:#2e1065; --d-ai-br:#a78bfa; --d-ai-tx:#ddd6fe;
      --d-sec-bg:#052e26; --d-sec-br:#34d399; --d-sec-tx:#a7f3d0;
      --d-obs-bg:#172033; --d-obs-br:#94a3b8; --d-obs-tx:#cbd5e1;
      --d-ext-bg:#0b1220; --d-ext-br:#cbd5e1; --d-ext-tx:#e2e8f0;
      --d-state-bg:#111c33; --d-state-br:#94a3b8; --d-state-tx:#e2e8f0;
      --d-bad-bg:#3f1d1d; --d-bad-br:#f87171; --d-bad-tx:#fecaca;
      --d-text:#e2e8f0; --d-muted:#94a3b8; --d-edge:#94a3b8; --d-edge-tx:#cbd5e1;
      --d-chip:#0f172a; --d-badge:#e2e8f0; --d-badge-tx:#0f172a;
    }
  }
  svg.ragos-diagram text{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  svg.ragos-diagram .t-title{font-size:15px;font-weight:650;}
  svg.ragos-diagram .t-line{font-size:12.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-small{font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-lane{font-size:12.5px;font-weight:700;letter-spacing:.06em;fill:var(--d-lane-tx);}
  svg.ragos-diagram .t-edge{font-size:12px;fill:var(--d-edge-tx);}
  svg.ragos-diagram .t-badge{font-size:11.5px;font-weight:700;fill:var(--d-badge-tx);}
  svg.ragos-diagram .t-head{font-size:17px;font-weight:700;fill:var(--d-text);}
  svg.ragos-diagram .edge{fill:none;stroke:var(--d-edge);stroke-width:1.7;}
  svg.ragos-diagram .edge-dash{fill:none;stroke:var(--d-edge);stroke-width:1.5;stroke-dasharray:6 5;}
  svg.ragos-diagram .lane{fill:var(--d-lane);stroke:var(--d-lane-br);stroke-width:1.5;}
  svg.ragos-diagram .chip{fill:var(--d-chip);stroke:var(--d-lane-br);stroke-width:1;}
  svg.ragos-diagram .t-code{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:12.5px;fill:var(--d-text);}
  svg.ragos-diagram .t-codesm{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .lifeline{stroke:var(--d-edge);stroke-width:1.6;stroke-dasharray:5 5;}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker></defs><rect width="1440" height="1010" fill="var(--d-bg)"/><text class="t-head" x="36" y="44" text-anchor="start">What RAG-OS reads from a document</text><text class="t-small" x="36" y="64">Almost everything is decided before the document is opened. Only step 5 looks inside it, and only for the facets the rules left empty. No layer here delays ingestion.</text><rect x="36" y="96" width="368" height="81" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="220.0" y="123.0" text-anchor="middle" fill="var(--d-data-tx)">1 · Where it came from</text><text class="t-line" x="220.0" y="146.0" text-anchor="middle">the source instance it belongs to</text><text class="t-line" x="220.0" y="163.0" text-anchor="middle">defaults: in config/sources/sources.yaml</text><text class="t-small" x="220.0" y="199" text-anchor="middle" font-weight="700">can set: anything · weakest layer</text><path class="edge" d="M220.0 211 L220.0 214"/><rect x="376" y="96" width="368" height="81" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="560.0" y="123.0" text-anchor="middle" fill="var(--d-data-tx)">2 · Its folder path</text><text class="t-line" x="560.0" y="146.0" text-anchor="middle">source-relative, matched by fnmatch globs</text><text class="t-line" x="560.0" y="163.0" text-anchor="middle">config/classification/path-rules.yaml</text><text class="t-small" x="560.0" y="199" text-anchor="middle" font-weight="700">can set: department · region · doc type</text><path class="edge" d="M560.0 211 L560.0 214"/><rect x="716" y="96" width="368" height="81" rx="10" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="900.0" y="123.0" text-anchor="middle" fill="var(--d-state-tx)">3 · Its filename</text><text class="t-line" x="900.0" y="146.0" text-anchor="middle">no rule reads it — but it becomes the title</text><text class="t-line" x="900.0" y="163.0" text-anchor="middle">when the parser finds none</text><text class="t-small" x="900.0" y="199" text-anchor="middle" font-weight="700">can set: indirectly: doc type · topic</text><path class="edge" d="M900.0 211 L900.0 214"/><rect x="1056" y="96" width="368" height="81" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="1240.0" y="123.0" text-anchor="middle" fill="var(--d-data-tx)">4 · What sits beside it</text><text class="t-line" x="1240.0" y="146.0" text-anchor="middle">&lt;file&gt;.&lt;ext&gt;.meta.json  ·  a manifest.csv row</text><text class="t-line" x="1240.0" y="163.0" text-anchor="middle">keyed by the lower-cased path</text><text class="t-small" x="1240.0" y="199" text-anchor="middle" font-weight="700">can set: anything · per file or in bulk</text><path class="edge" d="M1240.0 211 L1240.0 214"/><path class="edge" d="M220 214 L1240 214"/><path class="edge" d="M720 214 L720 246" marker-end="url(#arrow)"/><rect x="276" y="246" width="888" height="64" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="720.0" y="273.0" text-anchor="middle" fill="var(--d-query-tx)">TagResolver — later layer replaces earlier, per key</text><text class="t-line" x="720.0" y="296.0" text-anchor="middle">source defaults  &lt;  path rules (every match, last in the file wins)  &lt;  sidecar  &lt;  manifest</text><rect x="36" y="372" width="424" height="132" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="248.0" y="399.0" text-anchor="middle" fill="var(--d-ingest-tx)">5 · What is inside it</text><text class="t-line" x="248.0" y="422.0" text-anchor="middle">The classifier embeds nothing new: it reuses the mean of</text><text class="t-line" x="248.0" y="439.0" text-anchor="middle">the first 8 chunk vectors and compares it with a prototype</text><text class="t-line" x="248.0" y="456.0" text-anchor="middle">per facet value, built from that value's label, description</text><text class="t-line" x="248.0" y="473.0" text-anchor="middle">and synonyms. Only facets marked classify: true, and only</text><text class="t-line" x="248.0" y="490.0" text-anchor="middle">when layers 1-4 left them empty.</text><rect x="508" y="372" width="424" height="132" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="720.0" y="399.0" text-anchor="middle" fill="var(--d-sec-tx)">6 · Who decided — afterwards</text><text class="t-line" x="720.0" y="422.0" text-anchor="middle">By the time anyone opens /admin → Review queue the document</text><text class="t-line" x="720.0" y="439.0" text-anchor="middle">is ALREADY embedded, indexed and searchable. Review never</text><text class="t-line" x="720.0" y="456.0" text-anchor="middle">gates ingestion. An approval outranks every layer above, is</text><text class="t-line" x="720.0" y="473.0" text-anchor="middle">frozen against re-discovery, and re-tags the index in place</text><text class="t-line" x="720.0" y="490.0" text-anchor="middle">without re-embedding.</text><rect x="980" y="372" width="424" height="132" rx="10" fill="var(--d-bad-bg)" stroke="var(--d-bad-br)" stroke-width="1.6"/><text class="t-title" x="1192.0" y="399.0" text-anchor="middle" fill="var(--d-bad-tx)">What none of them read</text><text class="t-line" x="1192.0" y="422.0" text-anchor="middle">author, created and modified are extracted by the parsers</text><text class="t-line" x="1192.0" y="439.0" text-anchor="middle">and then discarded — they set no facet. There is no</text><text class="t-line" x="1192.0" y="456.0" text-anchor="middle">language detection anywhere: language comes from the</text><text class="t-line" x="1192.0" y="473.0" text-anchor="middle">source default. And no rule parses a document type out</text><text class="t-line" x="1192.0" y="490.0" text-anchor="middle">of a filename or an extension.</text><path class="edge" d="M720 340 L720 356 L248 356 L248 372" marker-end="url(#arrow)"/><path class="edge-dash" d="M720 340 L720 372" marker-end="url(#arrow)"/><rect x="36" y="546" width="1368" height="232" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.5"/><text class="t-title" x="56" y="574" fill="var(--d-text)" font-size="13">Worked example — every value keeps the name of the layer that set it (tags.sources)</text><text class="t-code" x="56" y="600" font-weight="700">hr/uk/policies/parental-leave-policy.md</text><text class="t-codesm" x="56" y="624" >department = [HR]</text><text class="t-small" x="800" y="624">path_rule: hr/**</text><text class="t-codesm" x="56" y="646" >region = [UK]</text><text class="t-small" x="800" y="646">path_rule: */uk/**</text><text class="t-codesm" x="56" y="668" >doc_type = [Policy]</text><text class="t-small" x="800" y="668">path_rule: */*/policies/**</text><text class="t-codesm" x="56" y="690" >topic = [Leave]</text><text class="t-small" x="800" y="690">manifest.csv</text><text class="t-codesm" x="56" y="712" >language = [en]</text><text class="t-small" x="800" y="712">source_default</text><text class="t-codesm" x="56" y="734" >acl_department = [HR] · acl_region = [UK] · acl_clearance = 1</text><text class="t-small" x="800" y="734">path rules + source default</text><rect x="36" y="806" width="1368" height="96.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-title" x="52" y="831.0" fill="var(--d-text)" font-size="13">The failure nobody reports</text><text class="t-line" x="52" y="849.0">A facet the rules leave empty and that is NOT classify: true - department, region, confidentiality, language - is never looked at by the classifier,</text><text class="t-line" x="52" y="866.0">so it never reaches the review queue either. The document is indexed with an empty value and nobody is told. For a business facet that only costs a filter;</text><text class="t-line" x="52" y="883.0">for a required access attribute the document becomes invisible to everyone. Check /admin → Documents grouped by facet before enabling a source.</text><rect x="36" y="966" width="16" height="13" rx="4" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.4"/><text class="t-small" x="60" y="976">Read from configuration</text><rect x="316" y="966" width="16" height="13" rx="4" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.4"/><text class="t-small" x="340" y="976">Read from the file itself</text><rect x="596" y="966" width="16" height="13" rx="4" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.4"/><text class="t-small" x="620" y="976">Costs compute, no tokens</text><rect x="876" y="966" width="16" height="13" rx="4" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.4"/><text class="t-small" x="900" y="976">Human decision</text><rect x="1156" y="966" width="16" height="13" rx="4" fill="var(--d-bad-bg)" stroke="var(--d-bad-br)" stroke-width="1.4"/><text class="t-small" x="1180" y="976">Read but not used</text></svg>