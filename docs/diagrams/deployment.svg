</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker></defs><rect width="1440" height="1074" fill="var(--d-bg)"/><text class="t-head" x="36" y="44" text-anchor="start">Azure deployment topology</text><text class="t-small" x="36" y="64">Names follow &lt;type&gt;-&lt;prefix&gt;-&lt;env&gt; with a deterministic 5-character suffix on globally unique names. Example below: prefix ragos, env dev, region westus.</text><rect x="36" y="84" width="250" height="45" rx="10" fill="var(--d-ext-bg)" stroke="var(--d-ext-br)" stroke-width="1.6"/><text class="t-title" x="161.0" y="111.0" text-anchor="middle" fill="var(--d-ext-tx)">Users  ·  Microsoft Entra ID</text><text class="t-small" x="306" y="110.5" font-weight="700">HTTPS 443  →  rag-chat-ui is the only public endpoint of the whole system</text><g transform="translate(0,64)"><rect x="36" y="84" width="1368" height="742" rx="16" fill="none" stroke="var(--d-ext-br)" stroke-width="1.6" stroke-dasharray="8 6"/><text class="t-lane" x="54" y="108">AZURE SUBSCRIPTION</text><rect x="52" y="122" width="1336" height="688" rx="14" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.5"/><text class="t-lane" x="70" y="146">RESOURCE GROUP  rg-ragos-dev  ·  westus</text><rect x="70" y="164" width="740" height="546" rx="12" fill="var(--d-bg)" stroke="var(--d-lane-br)" stroke-width="1.5"/><text class="t-lane" x="88" y="188">CONTAINER APPS ENVIRONMENT  cae-ragos-dev</text><text class="t-small" x="88" y="206">workload profiles keep the query path off the ingestion path · gpu-t4 is tei only</text><rect x="88" y="220" width="704" height="146" rx="10" fill="var(--d-query-bg)" opacity=".45"/><text class="t-small" x="102" y="240" font-weight="700">workload profile: query   ·   Dedicated D4   ·   1–3 nodes</text><rect x="102" y="250" width="214" height="81" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="209.0" y="277.0" text-anchor="middle" fill="var(--d-query-tx)">rag-chat-ui</text><text class="t-line" x="209.0" y="300.0" text-anchor="middle">EXTERNAL :8080</text><text class="t-line" x="209.0" y="317.0" text-anchor="middle">1–3 replicas</text><rect x="330" y="250" width="214" height="81" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="437.0" y="277.0" text-anchor="middle" fill="var(--d-query-tx)">rag-api</text><text class="t-line" x="437.0" y="300.0" text-anchor="middle">internal :8000</text><text class="t-line" x="437.0" y="317.0" text-anchor="middle">2–10 replicas</text><rect x="558" y="250" width="220" height="81" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="668.0" y="277.0" text-anchor="middle" fill="var(--d-query-tx)">rag-embed-query</text><text class="t-line" x="668.0" y="300.0" text-anchor="middle">internal :80</text><text class="t-line" x="668.0" y="317.0" text-anchor="middle">1–4 replicas · tei only</text><rect x="88" y="382" width="704" height="146" rx="10" fill="var(--d-ingest-bg)" opacity=".45"/><text class="t-small" x="102" y="402" font-weight="700">workload profile: ingest   ·   Dedicated D8   ·   0–3 nodes</text><rect x="102" y="412" width="214" height="81" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="209.0" y="439.0" text-anchor="middle" fill="var(--d-ingest-tx)">rag-ingest-worker</text><text class="t-line" x="209.0" y="462.0" text-anchor="middle">no ingress</text><text class="t-line" x="209.0" y="479.0" text-anchor="middle">KEDA 0–10</text><rect x="330" y="412" width="214" height="81" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="437.0" y="439.0" text-anchor="middle" fill="var(--d-ingest-tx)">job rag-scheduler</text><text class="t-line" x="437.0" y="462.0" text-anchor="middle">cron */5</text><text class="t-line" x="437.0" y="479.0" text-anchor="middle">parallelism 1</text><rect x="558" y="412" width="220" height="81" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="668.0" y="439.0" text-anchor="middle" fill="var(--d-ingest-tx)">job rag-bootstrap</text><text class="t-line" x="668.0" y="462.0" text-anchor="middle">manual trigger</text><text class="t-line" x="668.0" y="479.0" text-anchor="middle">migrations + index</text><rect x="88" y="544" width="704" height="146" rx="10" fill="var(--d-ingest-bg)" opacity=".28"/><text class="t-small" x="102" y="564" font-weight="700">workload profile: Consumption-GPU-NC8as-T4   ·   NVIDIA T4   ·   scale to zero · tei only</text><rect x="102" y="574" width="214" height="81" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="209.0" y="601.0" text-anchor="middle" fill="var(--d-ingest-tx)">rag-embed-ingest</text><text class="t-line" x="209.0" y="624.0" text-anchor="middle">internal :80</text><text class="t-line" x="209.0" y="641.0" text-anchor="middle">0–4 replicas · tei only</text><rect x="330" y="574" width="448" height="81.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-line" x="346" y="599.0">Falls back to the ingest profile (CPU image)</text><text class="t-line" x="346" y="616.0">when GPU quota is unavailable — same model,</text><text class="t-line" x="346" y="633.0">same embedding profile, lower throughput.</text><text class="t-lane" x="840" y="188">PLATFORM RESOURCES</text><text class="t-small" x="840" y="206">reached with the managed identity — no keys, no connection strings</text><rect x="840" y="220" width="258" height="98" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="969.0" y="247.0" text-anchor="middle" fill="var(--d-data-tx)">Container Registry</text><text class="t-line" x="969.0" y="270.0" text-anchor="middle">acrragosdev&lt;sfx&gt; · Basic</text><text class="t-line" x="969.0" y="287.0" text-anchor="middle">rag-api · rag-chat-ui</text><text class="t-line" x="969.0" y="304.0" text-anchor="middle">rag-embedder-cpu / -turing (tei only)</text><rect x="1118" y="220" width="258" height="98" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="1247.0" y="247.0" text-anchor="middle" fill="var(--d-sec-tx)">Key Vault</text><text class="t-line" x="1247.0" y="270.0" text-anchor="middle">kv-ragosdev-&lt;sfx&gt; · RBAC</text><text class="t-line" x="1247.0" y="287.0" text-anchor="middle">dev-jwt-signing-key</text><text class="t-line" x="1247.0" y="304.0" text-anchor="middle">appinsights-connection</text><rect x="840" y="352" width="258" height="98" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="969.0" y="379.0" text-anchor="middle" fill="var(--d-data-tx)">Storage account</text><text class="t-line" x="969.0" y="402.0" text-anchor="middle">stragosdev&lt;sfx&gt; · Standard_LRS</text><text class="t-line" x="969.0" y="419.0" text-anchor="middle">raw-docs · config · exports</text><text class="t-line" x="969.0" y="436.0" text-anchor="middle">shared keys disabled</text><rect x="1118" y="352" width="258" height="98" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="1247.0" y="379.0" text-anchor="middle" fill="var(--d-data-tx)">Service Bus</text><text class="t-line" x="1247.0" y="402.0" text-anchor="middle">sb-ragos-dev-&lt;sfx&gt; · Standard</text><text class="t-line" x="1247.0" y="419.0" text-anchor="middle">ingest-priority · ingest-bulk</text><text class="t-line" x="1247.0" y="436.0" text-anchor="middle">local auth disabled</text><rect x="840" y="484" width="258" height="98" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="969.0" y="511.0" text-anchor="middle" fill="var(--d-data-tx)">PostgreSQL Flexible</text><text class="t-line" x="969.0" y="534.0" text-anchor="middle">psql-ragos-dev-&lt;sfx&gt;</text><text class="t-line" x="969.0" y="551.0" text-anchor="middle">Standard_B2s · Burstable</text><text class="t-line" x="969.0" y="568.0" text-anchor="middle">Entra-only auth</text><rect x="1118" y="484" width="258" height="98" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="1247.0" y="511.0" text-anchor="middle" fill="var(--d-data-tx)">Azure AI Search</text><text class="t-line" x="1247.0" y="534.0" text-anchor="middle">srch-ragos-dev-&lt;sfx&gt; · S1</text><text class="t-line" x="1247.0" y="551.0" text-anchor="middle">2 replicas · 1 partition</text><text class="t-line" x="1247.0" y="568.0" text-anchor="middle">semantic ranker · no keys</text><rect x="840" y="616" width="258" height="98" rx="10" fill="var(--d-ai-bg)" stroke="var(--d-ai-br)" stroke-width="1.6"/><text class="t-title" x="969.0" y="643.0" text-anchor="middle" fill="var(--d-ai-tx)">Microsoft Foundry</text><text class="t-line" x="969.0" y="666.0" text-anchor="middle">aif-ragos-dev-&lt;sfx&gt; (AIServices)</text><text class="t-line" x="969.0" y="683.0" text-anchor="middle">project proj-ragos-dev</text><text class="t-line" x="969.0" y="700.0" text-anchor="middle">gpt-5-mini · claude-opus-5</text><rect x="1118" y="616" width="258" height="98" rx="10" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.6"/><text class="t-title" x="1247.0" y="643.0" text-anchor="middle" fill="var(--d-obs-tx)">Monitoring</text><text class="t-line" x="1247.0" y="666.0" text-anchor="middle">log-ragos-dev (Log Analytics)</text><text class="t-line" x="1247.0" y="683.0" text-anchor="middle">appi-ragos-dev (App Insights)</text><text class="t-line" x="1247.0" y="700.0" text-anchor="middle">budget-ragos-dev alert</text><path class="edge" d="M161 56 L161 214 L209 214 L209 250" marker-end="url(#arrow)"/><path class="edge" d="M810 470 L826 470" marker-end="url(#arrow)"/><path d="M826 232 L826 706" stroke="var(--d-edge)" stroke-width="1.4" fill="none" opacity=".6"/><path class="edge" d="M826 280 L834 280" marker-end="url(#arrow)"/><path class="edge" d="M826 412 L834 412" marker-end="url(#arrow)"/><path class="edge" d="M826 544 L834 544" marker-end="url(#arrow)"/><path class="edge" d="M826 676 L834 676" marker-end="url(#arrow)"/><rect x="70" y="726" width="1318" height="81" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="729.0" y="753.0" text-anchor="middle" fill="var(--d-sec-tx)">User-assigned managed identity  id-ragos-dev   ·   AZURE_CLIENT_ID on every workload</text><text class="t-line" x="729.0" y="776.0" text-anchor="middle">AcrPull   ·   Key Vault Secrets User   ·   Storage Blob Data Contributor   ·   Azure Service Bus Data Owner   ·   Search Index Data Contributor</text><text class="t-line" x="729.0" y="793.0" text-anchor="middle">Search Service Contributor   ·   Cognitive Services OpenAI User   ·   Cognitive Services User   ·   PostgreSQL Entra administrator</text></g><rect x="36" y="910" width="1368" height="96.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-title" x="52" y="935.0" fill="var(--d-text)" font-size="13">Boundaries and how this is created</text><text class="t-line" x="52" y="953.0">Public surface: only rag-chat-ui is external; rag-api and the embedder pools are internal. The rag-embed-* pools are tei only — an azure_openai profile deploys text-embedding-3-small instead.</text><text class="t-line" x="52" y="970.0">Secrets: two Key Vault secrets are referenced by the apps as keyvaultref: values resolved with the managed identity, so no secret value is ever stored in a template, image or repository.</text><text class="t-line" x="52" y="987.0">Deployment: infra/scripts/00-prereqs.ps1 … 08-bootstrap.ps1 (PowerShell 7 + az CLI) create everything above; re-running them is safe. Settings live in infra/env/dev.psd1.</text><rect x="36" y="1034" width="16" height="13" rx="4" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.4"/><text class="t-small" x="60" y="1044">query profile</text><rect x="264" y="1034" width="16" height="13" rx="4" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.4"/><text class="t-small" x="288" y="1044">ingest / GPU profile</text><rect x="492" y="1034" width="16" height="13" rx="4" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.4"/><text class="t-small" x="516" y="1044">Data &amp; messaging</text><rect x="720" y="1034" width="16" height="13" rx="4" fill="var(--d-ai-bg)" stroke="var(--d-ai-br)" stroke-width="1.4"/><text class="t-small" x="744" y="1044">AI service</text><rect x="948" y="1034" width="16" height="13" rx="4" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.4"/><text class="t-small" x="972" y="1044">Identity &amp; secrets</text><rect x="1176" y="1034" width="16" height="13" rx="4" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.4"/><text class="t-small" x="1200" y="1044">Monitoring</text></svg>