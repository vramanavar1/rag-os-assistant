<svg class="ragos-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1074" width="1440" height="1074" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Azure deployment topology: resource group, Container Apps environment and platform resources"><title>Azure deployment topology: resource group, Container Apps environment and platform resources</title><style>
  svg.ragos-diagram{
    --d-bg:#ffffff; --d-lane:#f8fafc; --d-lane-br:#e2e8f0; --d-lane-tx:#475569;
    --d-query-bg:#eef2ff; --d-query-br:#6366f1; --d-query-tx:#312e81;
