<svg class="ragos-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sequence: a question travels from a signed-in browser to a cited answer"><title>Sequence: a question travels from a signed-in browser to a cited answer</title><style>
  svg.ragos-diagram{
    --d-bg:#ffffff; --d-lane:#f8fafc; --d-lane-br:#e2e8f0; --d-lane-tx:#475569;
    --d-query-bg:#eef2ff; --d-query-br:#6366f1; --d-query-tx:#312e81;
    --d-ingest-bg:#fff7ed; --d-ingest-br:#f59e0b; --d-ingest-tx:#92400e;
    --d-data-bg:#f1f5f9; --d-data-br:#64748b; --d-data-tx:#1e293b;
    --d-ai-bg:#f5f3ff; --d-ai-br:#8b5cf6; --d-ai-tx:#5b21b6;
    --d-sec-bg:#ecfdf5; --d-sec-br:#10b981; --d-sec-tx:#065f46;
    --d-obs-bg:#f8fafc; --d-obs-br:#94a3b8; --d-obs-tx:#334155;
    --d-ext-bg:#ffffff; --d-ext-br:#0f172a; --d-ext-tx:#0f172a;
    --d-state-bg:#ffffff; --d-state-br:#334155; --d-state-tx:#0f172a;
    --d-bad-bg:#fef2f2; --d-bad-br:#ef4444; --d-bad-tx:#991b1b;
    --d-text:#0f172a; --d-muted:#475569; --d-edge:#64748b; --d-edge-tx:#334155;
    --d-chip:#ffffff; --d-badge:#0f172a; --d-badge-tx:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    svg.ragos-diagram{
      --d-bg:#0f172a; --d-lane:#111c33; --d-lane-br:#2a3a56; --d-lane-tx:#94a3b8;
      --d-query-bg:#1e1b4b; --d-query-br:#818cf8; --d-query-tx:#c7d2fe;
      --d-ingest-bg:#3b2a0c; --d-ingest-br:#fbbf24; --d-ingest-tx:#fde68a;
      --d-data-bg:#1c2942; --d-data-br:#94a3b8; --d-data-tx:#e2e8f0;
      --d-ai-bg:#2e1065; --d-ai-br:#a78bfa; --d-ai-tx:#ddd6fe;
      --d-sec-bg:#052e26; --d-sec-br:#34d399; --d-sec-tx:#a7f3d0;
      --d-obs-bg:#172033; --d-obs-br:#94a3b8; --d-obs-tx:#cbd5e1;
      --d-ext-bg:#0b1220; --d-ext-br:#cbd5e1; --d-ext-tx:#e2e8f0;
      --d-state-bg:#111c33; --d-state-br:#94a3b8; --d-state-tx:#e2e8f0;
      --d-bad-bg:#3f1d1d; --d-bad-br:#f87171; --d-bad-tx:#fecaca;
      --d-text:#e2e8f0; --d-muted:#94a3b8; --d-edge:#94a3b8; --d-edge-tx:#cbd5e1;
      --d-chip:#0f172a; --d-badge:#e2e8f0; --d-badge-tx:#0f172a;
    }
  }
  svg.ragos-diagram text{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  svg.ragos-diagram .t-title{font-size:15px;font-weight:650;}
  svg.ragos-diagram .t-line{font-size:12.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-small{font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-lane{font-size:12.5px;font-weight:700;letter-spacing:.06em;fill:var(--d-lane-tx);}
  svg.ragos-diagram .t-edge{font-size:12px;fill:var(--d-edge-tx);}
  svg.ragos-diagram .t-badge{font-size:11.5px;font-weight:700;fill:var(--d-badge-tx);}
  svg.ragos-diagram .t-head{font-size:17px;font-weight:700;fill:var(--d-text);}
  svg.ragos-diagram .edge{fill:none;stroke:var(--d-edge);stroke-width:1.7;}
  svg.ragos-diagram .edge-dash{fill:none;stroke:var(--d-edge);stroke-width:1.5;stroke-dasharray:6 5;}
  svg.ragos-diagram .lane{fill:var(--d-lane);stroke:var(--d-lane-br);stroke-width:1.5;}
  svg.ragos-diagram .chip{fill:var(--d-chip);stroke:var(--d-lane-br);stroke-width:1;}
  svg.ragos-diagram .t-code{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:12.5px;fill:var(--d-text);}
  svg.ragos-diagram .t-codesm{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .lifeline{stroke:var(--d-edge);stroke-width:1.6;stroke-dasharray:5 5;}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker></defs><rect width="1440" height="1000" fill="var(--d-bg)"/><text class="t-head" x="36" y="44" text-anchor="start">What happens when someone asks a question</text><text class="t-small" x="36" y="64">Every step carries the same X-Correlation-ID, so one identifier links the browser request, the search call and the model call in Application Insights.</text><rect x="45.0" y="96" width="184" height="64" rx="10" fill="var(--d-ext-bg)" stroke="var(--d-ext-br)" stroke-width="1.6"/><text class="t-title" x="137.0" y="123.0" text-anchor="middle" fill="var(--d-ext-tx)">Browser</text><text class="t-line" x="137.0" y="146.0" text-anchor="middle">MSAL · Entra sign-in</text><path class="lifeline" d="M137.0 162 L137.0 836"/><rect x="239.0" y="96" width="184" height="64" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="331.0" y="123.0" text-anchor="middle" fill="var(--d-query-tx)">rag-chat-ui</text><text class="t-line" x="331.0" y="146.0" text-anchor="middle">nginx · external :8080</text><path class="lifeline" d="M331.0 162 L331.0 836"/><rect x="433.0" y="96" width="184" height="64" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="525.0" y="123.0" text-anchor="middle" fill="var(--d-query-tx)">rag-api</text><text class="t-line" x="525.0" y="146.0" text-anchor="middle">FastAPI · internal :8000</text><path class="lifeline" d="M525.0 162 L525.0 836"/><rect x="627.0" y="96" width="184" height="64" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="719.0" y="123.0" text-anchor="middle" fill="var(--d-sec-tx)">AccessPolicyEngine</text><text class="t-line" x="719.0" y="146.0" text-anchor="middle">access-policy.yaml</text><path class="lifeline" d="M719.0 162 L719.0 836"/><rect x="821.0" y="96" width="184" height="64" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="913.0" y="123.0" text-anchor="middle" fill="var(--d-query-tx)">rag-embed-query</text><text class="t-line" x="913.0" y="146.0" text-anchor="middle">TEI · Qwen3-Embedding</text><path class="lifeline" d="M913.0 162 L913.0 836"/><rect x="1015.0" y="96" width="184" height="64" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="1107.0" y="123.0" text-anchor="middle" fill="var(--d-data-tx)">Azure AI Search S1</text><text class="t-line" x="1107.0" y="146.0" text-anchor="middle">kb-&lt;domain&gt;-&lt;fp&gt;</text><path class="lifeline" d="M1107.0 162 L1107.0 836"/><rect x="1209.0" y="96" width="184" height="64" rx="10" fill="var(--d-ai-bg)" stroke="var(--d-ai-br)" stroke-width="1.6"/><text class="t-title" x="1301.0" y="123.0" text-anchor="middle" fill="var(--d-ai-tx)">Microsoft Foundry</text><text class="t-line" x="1301.0" y="146.0" text-anchor="middle">claude-opus-5 / gpt-5-mini</text><path class="lifeline" d="M1301.0 162 L1301.0 836"/><path class="edge" d="M147.0 200 L321.0 200" marker-end="url(#arrow)"/><rect class="chip" x="14.449999999999989" y="173" width="439.1" height="21" rx="7"/><text class="t-edge" x="234.0" y="188" text-anchor="middle">GET /  ·  access token acquired for api://&lt;app-id&gt;/access_as_user</text><circle cx="129.0" cy="200" r="11" fill="var(--d-badge)"/><text class="t-badge" x="129.0" y="204" text-anchor="middle">1</text><path class="edge" d="M341.0 256 L515.0 256" marker-end="url(#arrow)"/><rect class="chip" x="188.82999999999998" y="229" width="478.34000000000003" height="21" rx="7"/><text class="t-edge" x="428.0" y="244" text-anchor="middle">POST /api/chat   ·   Authorization: Bearer &lt;JWT&gt;   ·   X-Correlation-ID</text><circle cx="323.0" cy="256" r="11" fill="var(--d-badge)"/><text class="t-badge" x="323.0" y="260" text-anchor="middle">2</text><path class="edge" d="M525.0 312 L649.0 312 L649.0 338 L535.0 338" marker-end="url(#arrow)"/><rect class="chip" x="324.93999999999994" y="285" width="524.1200000000001" height="21" rx="7"/><text class="t-edge" x="587.0" y="300" text-anchor="middle">validate issuer / algorithm / audience / expiry, then map claims to attributes</text><circle cx="505.0" cy="312" r="11" fill="var(--d-badge)"/><text class="t-badge" x="505.0" y="316" text-anchor="middle">3</text><path class="edge" d="M535.0 376 L709.0 376" marker-end="url(#arrow)"/><rect class="chip" x="559.41" y="349" width="125.18" height="21" rx="7"/><text class="t-edge" x="622.0" y="364" text-anchor="middle">decide(principal)</text><circle cx="517.0" cy="376" r="11" fill="var(--d-badge)"/><text class="t-badge" x="517.0" y="380" text-anchor="middle">4</text><path class="edge-dash" d="M709.0 432 L535.0 432" marker-end="url(#arrow)"/><rect class="chip" x="395.90999999999997" y="405" width="452.18" height="21" rx="7"/><text class="t-edge" x="622.0" y="420" text-anchor="middle">OData filter   ·   or DENY_ALL when a required attribute is missing</text><circle cx="727.0" cy="432" r="11" fill="var(--d-badge)"/><text class="t-badge" x="727.0" y="436" text-anchor="middle">5</text><path class="edge" d="M535.0 488 L903.0 488" marker-end="url(#arrow)"/><rect class="chip" x="499.45" y="461" width="439.1" height="21" rx="7"/><text class="t-edge" x="719.0" y="476" text-anchor="middle">POST /v1/embeddings   ·   query prefix from the embedding profile</text><circle cx="517.0" cy="488" r="11" fill="var(--d-badge)"/><text class="t-badge" x="517.0" y="492" text-anchor="middle">6</text><path class="edge-dash" d="M903.0 544 L535.0 544" marker-end="url(#arrow)"/><rect class="chip" x="643.33" y="517" width="151.34" height="21" rx="7"/><text class="t-edge" x="719.0" y="532" text-anchor="middle">1024-dimension vector</text><circle cx="921.0" cy="544" r="11" fill="var(--d-badge)"/><text class="t-badge" x="921.0" y="548" text-anchor="middle">7</text><path class="edge" d="M535.0 600 L1097.0 600" marker-end="url(#arrow)"/><rect class="chip" x="602.99" y="573" width="426.02000000000004" height="21" rx="7"/><text class="t-edge" x="816.0" y="588" text-anchor="middle">hybrid + semantic search, access filter INSIDE the query, top 8</text><circle cx="517.0" cy="600" r="11" fill="var(--d-badge)"/><text class="t-badge" x="517.0" y="604" text-anchor="middle">8</text><path class="edge-dash" d="M1097.0 656 L535.0 656" marker-end="url(#arrow)"/><rect class="chip" x="629.15" y="629" width="373.70000000000005" height="21" rx="7"/><text class="t-edge" x="816.0" y="644" text-anchor="middle">only the chunks this caller may read (+ reranker score)</text><circle cx="1115.0" cy="656" r="11" fill="var(--d-badge)"/><text class="t-badge" x="1115.0" y="660" text-anchor="middle">9</text><path class="edge" d="M535.0 712 L1291.0 712" marker-end="url(#arrow)"/><rect class="chip" x="732.69" y="685" width="360.62" height="21" rx="7"/><text class="t-edge" x="913.0" y="700" text-anchor="middle">system rules + numbered context blocks + the question</text><circle cx="517.0" cy="712" r="11" fill="var(--d-badge)"/><text class="t-badge" x="517.0" y="716" text-anchor="middle">10</text><path class="edge-dash" d="M1291.0 768 L535.0 768" marker-end="url(#arrow)"/><rect class="chip" x="680.37" y="741" width="465.26000000000005" height="21" rx="7"/><text class="t-edge" x="913.0" y="756" text-anchor="middle">answer with [n] citations   ·   usage: input / output / cached tokens</text><circle cx="1309.0" cy="768" r="11" fill="var(--d-badge)"/><text class="t-badge" x="1309.0" y="772" text-anchor="middle">11</text><path class="edge-dash" d="M515.0 824 L341.0 824" marker-end="url(#arrow)"/><rect class="chip" x="221.52999999999997" y="797" width="412.94000000000005" height="21" rx="7"/><text class="t-edge" x="428.0" y="812" text-anchor="middle">200  { answer, citations, usage, timings_ms, correlation_id }</text><circle cx="533.0" cy="824" r="11" fill="var(--d-badge)"/><text class="t-badge" x="533.0" y="828" text-anchor="middle">12</text><rect x="40" y="856" width="1360" height="96.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-title" x="56" y="881.0" fill="var(--d-text)" font-size="13">Where the request stops early</text><text class="t-line" x="56" y="899.0">Missing required attribute (no department, say) → DENY_ALL: the search is never executed and the caller is told they have no access.</text><text class="t-line" x="56" y="916.0">No chunk passes the filter or the reranker threshold → "I could not find this in the documents available to you." — no model call is made.</text><text class="t-line" x="56" y="933.0">An answer that cites nothing is refused as ungrounded; a Claude refusal (stop_reason = refusal) is retried once on Azure OpenAI.</text><rect x="40" y="964" width="16" height="13" rx="4" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.4"/><text class="t-small" x="64" y="974">RAG-OS app</text><rect x="290" y="964" width="16" height="13" rx="4" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.4"/><text class="t-small" x="314" y="974">Access control</text><rect x="540" y="964" width="16" height="13" rx="4" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.4"/><text class="t-small" x="564" y="974">Search index</text><rect x="790" y="964" width="16" height="13" rx="4" fill="var(--d-ai-bg)" stroke="var(--d-ai-br)" stroke-width="1.4"/><text class="t-small" x="814" y="974">Model</text><rect x="1040" y="964" width="16" height="13" rx="4" fill="var(--d-ext-bg)" stroke="var(--d-ext-br)" stroke-width="1.4"/><text class="t-small" x="1064" y="974">Outside RAG-OS</text><text class="t-small" x="1400" y="974" text-anchor="end">dashed arrow = response</text></svg>