<svg class="ragos-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 886" width="1440" height="886" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Document lifecycle: the states one document moves through and every exit from them"><title>Document lifecycle: the states one document moves through and every exit from them</title><style>
  svg.ragos-diagram{
    --d-bg:#ffffff; --d-lane:#f8fafc; --d-lane-br:#e2e8f0; --d-lane-tx:#475569;
    --d-query-bg:#eef2ff; --d-query-br:#6366f1; --d-query-tx:#312e81;
    --d-ingest-bg:#fff7ed; --d-ingest-br:#f59e0b; --d-ingest-tx:#92400e;
    --d-data-bg:#f1f5f9; --d-data-br:#64748b; --d-data-tx:#1e293b;
    --d-ai-bg:#f5f3ff; --d-ai-br:#8b5cf6; --d-ai-tx:#5b21b6;
    --d-sec-bg:#ecfdf5; --d-sec-br:#10b981; --d-sec-tx:#065f46;
    --d-obs-bg:#f8fafc; --d-obs-br:#94a3b8; --d-obs-tx:#334155;
    --d-ext-bg:#ffffff; --d-ext-br:#0f172a; --d-ext-tx:#0f172a;
    --d-state-bg:#ffffff; --d-state-br:#334155; --d-state-tx:#0f172a;
    --d-bad-bg:#fef2f2; --d-bad-br:#ef4444; --d-bad-tx:#991b1b;
    --d-text:#0f172a; --d-muted:#475569; --d-edge:#64748b; --d-edge-tx:#334155;
    --d-chip:#ffffff; --d-badge:#0f172a; --d-badge-tx:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    svg.ragos-diagram{
      --d-bg:#0f172a; --d-lane:#111c33; --d-lane-br:#2a3a56; --d-lane-tx:#94a3b8;
      --d-query-bg:#1e1b4b; --d-query-br:#818cf8; --d-query-tx:#c7d2fe;
      --d-ingest-bg:#3b2a0c; --d-ingest-br:#fbbf24; --d-ingest-tx:#fde68a;
      --d-data-bg:#1c2942; --d-data-br:#94a3b8; --d-data-tx:#e2e8f0;
      --d-ai-bg:#2e1065; --d-ai-br:#a78bfa; --d-ai-tx:#ddd6fe;
      --d-sec-bg:#052e26; --d-sec-br:#34d399; --d-sec-tx:#a7f3d0;
      --d-obs-bg:#172033; --d-obs-br:#94a3b8; --d-obs-tx:#cbd5e1;
      --d-ext-bg:#0b1220; --d-ext-br:#cbd5e1; --d-ext-tx:#e2e8f0;
      --d-state-bg:#111c33; --d-state-br:#94a3b8; --d-state-tx:#e2e8f0;
      --d-bad-bg:#3f1d1d; --d-bad-br:#f87171; --d-bad-tx:#fecaca;
      --d-text:#e2e8f0; --d-muted:#94a3b8; --d-edge:#94a3b8; --d-edge-tx:#cbd5e1;
      --d-chip:#0f172a; --d-badge:#e2e8f0; --d-badge-tx:#0f172a;
    }
  }
  svg.ragos-diagram text{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  svg.ragos-diagram .t-title{font-size:15px;font-weight:650;}
  svg.ragos-diagram .t-line{font-size:12.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-small{font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-lane{font-size:12.5px;font-weight:700;letter-spacing:.06em;fill:var(--d-lane-tx);}
  svg.ragos-diagram .t-edge{font-size:12px;fill:var(--d-edge-tx);}
  svg.ragos-diagram .t-badge{font-size:11.5px;font-weight:700;fill:var(--d-badge-tx);}
  svg.ragos-diagram .t-head{font-size:17px;font-weight:700;fill:var(--d-text);}
  svg.ragos-diagram .edge{fill:none;stroke:var(--d-edge);stroke-width:1.7;}
  svg.ragos-diagram .edge-dash{fill:none;stroke:var(--d-edge);stroke-width:1.5;stroke-dasharray:6 5;}
  svg.ragos-diagram .lane{fill:var(--d-lane);stroke:var(--d-lane-br);stroke-width:1.5;}
  svg.ragos-diagram .chip{fill:var(--d-chip);stroke:var(--d-lane-br);stroke-width:1;}
  svg.ragos-diagram .t-code{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:12.5px;fill:var(--d-text);}
  svg.ragos-diagram .t-codesm{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .lifeline{stroke:var(--d-edge);stroke-width:1.6;stroke-dasharray:5 5;}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker></defs><rect width="1440" height="886" fill="var(--d-bg)"/><text class="t-head" x="36" y="44" text-anchor="start">The life of one document</text><text class="t-small" x="36" y="64">Every transition is stored with a timestamp, so /admin shows a timeline per document. Chunk ids are derived from document id + content hash + ordinal, which is what makes re-processing safe.</text><rect x="54" y="276" width="168" height="45" rx="22" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="138.0" y="303.0" text-anchor="middle" fill="var(--d-state-tx)">DISCOVERED</text><text class="t-small" x="138.0" y="360" text-anchor="middle">listed by the scheduler,</text><text class="t-small" x="138.0" y="376" text-anchor="middle">the CLI or an upload</text><rect x="248" y="276" width="168" height="45" rx="22" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="332.0" y="303.0" text-anchor="middle" fill="var(--d-state-tx)">QUEUED</text><text class="t-small" x="332.0" y="360" text-anchor="middle">claim-check message on</text><text class="t-small" x="332.0" y="376" text-anchor="middle">the priority or bulk lane</text><rect x="442" y="276" width="168" height="45" rx="22" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="526.0" y="303.0" text-anchor="middle" fill="var(--d-state-tx)">PARSING</text><text class="t-small" x="526.0" y="360" text-anchor="middle">parser factory picks one</text><text class="t-small" x="526.0" y="376" text-anchor="middle">of the 10 format readers</text><rect x="636" y="276" width="168" height="45" rx="22" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="720.0" y="303.0" text-anchor="middle" fill="var(--d-state-tx)">CHUNKED</text><text class="t-small" x="720.0" y="360" text-anchor="middle">token chunker · tables and</text><text class="t-small" x="720.0" y="376" text-anchor="middle">headings kept together</text><rect x="830" y="276" width="168" height="45" rx="22" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="914.0" y="303.0" text-anchor="middle" fill="var(--d-state-tx)">EMBEDDED</text><text class="t-small" x="914.0" y="360" text-anchor="middle">GPU pool · 32 chunks per</text><text class="t-small" x="914.0" y="376" text-anchor="middle">call · self-hosted model</text><rect x="1024" y="276" width="168" height="45" rx="22" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="1108.0" y="303.0" text-anchor="middle" fill="var(--d-state-tx)">CLASSIFIED</text><text class="t-small" x="1108.0" y="360" text-anchor="middle">unset facets filled from the</text><text class="t-small" x="1108.0" y="376" text-anchor="middle">same vectors — no tokens</text><rect x="1218" y="276" width="168" height="45" rx="22" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="1302.0" y="303.0" text-anchor="middle" fill="var(--d-state-tx)">INDEXED</text><text class="t-small" x="1302.0" y="360" text-anchor="middle">new version upserted, old</text><text class="t-small" x="1302.0" y="376" text-anchor="middle">chunks deleted afterwards</text><path class="edge" d="M222 298.5 L248 298.5" marker-end="url(#arrow)"/><path class="edge" d="M416 298.5 L442 298.5" marker-end="url(#arrow)"/><path class="edge" d="M610 298.5 L636 298.5" marker-end="url(#arrow)"/><path class="edge" d="M804 298.5 L830 298.5" marker-end="url(#arrow)"/><path class="edge" d="M998 298.5 L1024 298.5" marker-end="url(#arrow)"/><path class="edge" d="M1192 298.5 L1218 298.5" marker-end="url(#arrow)"/><rect x="54" y="122" width="302" height="81" rx="10" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="205.0" y="149.0" text-anchor="middle" fill="var(--d-state-tx)">SKIPPED_UNCHANGED</text><text class="t-line" x="205.0" y="172.0" text-anchor="middle">content hash and tags identical:</text><text class="t-line" x="205.0" y="189.0" text-anchor="middle">no message, no embedding call</text><path class="edge" d="M138.0 276 L138.0 203" marker-end="url(#arrow)"/><rect class="chip" x="81.94999999999999" y="233" width="112.10000000000001" height="21" rx="7"/><text class="t-edge" x="138.0" y="248" text-anchor="middle">nothing changed</text><rect x="566" y="122" width="640" height="64" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="886.0" y="149.0" text-anchor="middle" fill="var(--d-ingest-tx)">RETAG   ·   tags or ACL changed, content did not</text><text class="t-line" x="886.0" y="172.0" text-anchor="middle">the facet and ACL fields are merged into the existing chunks — no parse, no embedding, no new version</text><path class="edge" d="M332.0 276 L332.0 196 L544 196 L544 154.0 L566 154.0" marker-end="url(#arrow)"/><path class="edge" d="M1206 154.0 L1228 154.0 L1228 218 L1302.0 218 L1302.0 276" marker-end="url(#arrow)"/><rect x="300" y="500" width="430" height="64" rx="10" fill="var(--d-bad-bg)" stroke="var(--d-bad-br)" stroke-width="1.6"/><text class="t-title" x="515.0" y="527.0" text-anchor="middle" fill="var(--d-bad-tx)">FAILED</text><text class="t-line" x="515.0" y="550.0" text-anchor="middle">stage, error type and message kept and shown in /admin</text><rect x="782" y="500" width="376" height="64" rx="10" fill="var(--d-bad-bg)" stroke="var(--d-bad-br)" stroke-width="1.6"/><text class="t-title" x="970.0" y="527.0" text-anchor="middle" fill="var(--d-bad-tx)">Dead-letter queue</text><text class="t-line" x="970.0" y="550.0" text-anchor="middle">listed in /admin · re-driven with one click</text><rect x="1204" y="500" width="200" height="81" rx="10" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.6"/><text class="t-title" x="1304.0" y="527.0" text-anchor="middle" fill="var(--d-state-tx)">DELETED</text><text class="t-line" x="1304.0" y="550.0" text-anchor="middle">every chunk removed</text><text class="t-line" x="1304.0" y="567.0" text-anchor="middle">from the index</text><path class="edge" d="M526.0 321 L526.0 432 L635.0 432 L635.0 500" marker-end="url(#arrow)"/><rect class="chip" x="613.66" y="421" width="288.68" height="21" rx="7"/><text class="t-edge" x="758.0" y="436" text-anchor="middle">permanent: corrupt · unsupported · no text</text><path class="edge" d="M332.0 321 L332.0 466 L385.0 466 L385.0 500" marker-end="url(#arrow)"/><rect class="chip" x="254.17" y="455" width="203.66000000000003" height="21" rx="7"/><text class="t-edge" x="356.0" y="470" text-anchor="middle">transient error, 5 deliveries</text><path class="edge" d="M730 532.0 L782 532.0" marker-end="url(#arrow)"/><rect class="chip" x="726.11" y="491.0" width="59.78" height="21" rx="7"/><text class="t-edge" x="756.0" y="506.0" text-anchor="middle">5th try</text><path class="edge" d="M515.0 564 L515.0 596 L262 596 L262 298.5 L248 298.5" marker-end="url(#arrow)"/><rect class="chip" x="319.85" y="585" width="308.3" height="21" rx="7"/><text class="t-edge" x="474" y="600" text-anchor="middle">admin retry:  POST /api/admin/ingestion/retry</text><path class="edge" d="M1302.0 321 L1302.0 448 L1304.0 448 L1304.0 500" marker-end="url(#arrow)"/><rect class="chip" x="1234.87" y="437" width="138.26" height="21" rx="7"/><text class="t-edge" x="1304.0" y="452" text-anchor="middle">not seen in the run</text><rect x="36" y="660" width="1368" height="113.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-title" x="52" y="685.0" fill="var(--d-text)" font-size="13">Why this is safe to run again</text><text class="t-line" x="52" y="703.0">Re-running a source costs one state lookup per unchanged document: no queue message, no embedding call, no index write.</text><text class="t-line" x="52" y="720.0">A redelivered message for a version that is already indexed is skipped, so at-least-once delivery cannot produce duplicate chunks.</text><text class="t-line" x="52" y="737.0">A crash between the database write and the queue send is repaired by the scheduler's reconciliation pass, which re-queues documents stuck in flight.</text><text class="t-line" x="52" y="754.0">The new version is written before the previous one is deleted, so a search never sees a gap while a document is being re-indexed.</text><rect x="36" y="834" width="16" height="13" rx="4" fill="var(--d-state-bg)" stroke="var(--d-state-br)" stroke-width="1.4"/><text class="t-small" x="60" y="844">Pipeline state</text><rect x="366" y="834" width="16" height="13" rx="4" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.4"/><text class="t-small" x="390" y="844">Shortcut (no re-embedding)</text><rect x="696" y="834" width="16" height="13" rx="4" fill="var(--d-bad-bg)" stroke="var(--d-bad-br)" stroke-width="1.4"/><text class="t-small" x="720" y="844">Failure path</text></svg>