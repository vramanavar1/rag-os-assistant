<svg class="ragos-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 926" width="1440" height="926" preserveAspectRatio="xMidYMid meet" role="img" aria-label="How documents are organised and classified, layer by layer"><title>How documents are organised and classified, layer by layer</title><style>
  svg.ragos-diagram{
    --d-bg:#ffffff; --d-lane:#f8fafc; --d-lane-br:#e2e8f0; --d-lane-tx:#475569;
    --d-query-bg:#eef2ff; --d-query-br:#6366f1; --d-query-tx:#312e81;
    --d-ingest-bg:#fff7ed; --d-ingest-br:#f59e0b; --d-ingest-tx:#92400e;
    --d-data-bg:#f1f5f9; --d-data-br:#64748b; --d-data-tx:#1e293b;
    --d-ai-bg:#f5f3ff; --d-ai-br:#8b5cf6; --d-ai-tx:#5b21b6;
    --d-sec-bg:#ecfdf5; --d-sec-br:#10b981; --d-sec-tx:#065f46;
    --d-obs-bg:#f8fafc; --d-obs-br:#94a3b8; --d-obs-tx:#334155;
    --d-ext-bg:#ffffff; --d-ext-br:#0f172a; --d-ext-tx:#0f172a;
    --d-state-bg:#ffffff; --d-state-br:#334155; --d-state-tx:#0f172a;
    --d-bad-bg:#fef2f2; --d-bad-br:#ef4444; --d-bad-tx:#991b1b;
    --d-text:#0f172a; --d-muted:#475569; --d-edge:#64748b; --d-edge-tx:#334155;
    --d-chip:#ffffff; --d-badge:#0f172a; --d-badge-tx:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    svg.ragos-diagram{
      --d-bg:#0f172a; --d-lane:#111c33; --d-lane-br:#2a3a56; --d-lane-tx:#94a3b8;
      --d-query-bg:#1e1b4b; --d-query-br:#818cf8; --d-query-tx:#c7d2fe;
      --d-ingest-bg:#3b2a0c; --d-ingest-br:#fbbf24; --d-ingest-tx:#fde68a;
      --d-data-bg:#1c2942; --d-data-br:#94a3b8; --d-data-tx:#e2e8f0;
      --d-ai-bg:#2e1065; --d-ai-br:#a78bfa; --d-ai-tx:#ddd6fe;
      --d-sec-bg:#052e26; --d-sec-br:#34d399; --d-sec-tx:#a7f3d0;
      --d-obs-bg:#172033; --d-obs-br:#94a3b8; --d-obs-tx:#cbd5e1;
      --d-ext-bg:#0b1220; --d-ext-br:#cbd5e1; --d-ext-tx:#e2e8f0;
      --d-state-bg:#111c33; --d-state-br:#94a3b8; --d-state-tx:#e2e8f0;
      --d-bad-bg:#3f1d1d; --d-bad-br:#f87171; --d-bad-tx:#fecaca;
      --d-text:#e2e8f0; --d-muted:#94a3b8; --d-edge:#94a3b8; --d-edge-tx:#cbd5e1;
      --d-chip:#0f172a; --d-badge:#e2e8f0; --d-badge-tx:#0f172a;
    }
  }
  svg.ragos-diagram text{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  svg.ragos-diagram .t-title{font-size:15px;font-weight:650;}
  svg.ragos-diagram .t-line{font-size:12.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-small{font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-lane{font-size:12.5px;font-weight:700;letter-spacing:.06em;fill:var(--d-lane-tx);}
  svg.ragos-diagram .t-edge{font-size:12px;fill:var(--d-edge-tx);}
  svg.ragos-diagram .t-badge{font-size:11.5px;font-weight:700;fill:var(--d-badge-tx);}
  svg.ragos-diagram .t-head{font-size:17px;font-weight:700;fill:var(--d-text);}
  svg.ragos-diagram .edge{fill:none;stroke:var(--d-edge);stroke-width:1.7;}
  svg.ragos-diagram .edge-dash{fill:none;stroke:var(--d-edge);stroke-width:1.5;stroke-dasharray:6 5;}
  svg.ragos-diagram .lane{fill:var(--d-lane);stroke:var(--d-lane-br);stroke-width:1.5;}
  svg.ragos-diagram .chip{fill:var(--d-chip);stroke:var(--d-lane-br);stroke-width:1;}
  svg.ragos-diagram .t-code{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:12.5px;fill:var(--d-text);}
  svg.ragos-diagram .t-codesm{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .lifeline{stroke:var(--d-edge);stroke-width:1.6;stroke-dasharray:5 5;}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker></defs><rect width="1440" height="926" fill="var(--d-bg)"/><text class="t-head" x="36" y="44" text-anchor="start">How documents get classified</text><text class="t-small" x="36" y="64">Cheapest layer first. Later layers override earlier ones for the same facet; an SME decision is never overwritten by a rule. Only facets still empty reach the classifier.</text><path class="edge" d="M74 130 L74 586" marker-end="url(#arrow)"/><text class="t-small" x="58" y="350" transform="rotate(-90 58 358)" text-anchor="middle" font-weight="700">later layers win</text><rect x="96" y="118" width="1010" height="58" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.5"/><circle cx="126" cy="147.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="126" y="151.0" text-anchor="middle">1</text><text class="t-title" x="152" y="143" fill="var(--d-data-tx)">Source defaults</text><text class="t-small" x="152" y="163">defaults: in each instance in config/sources/sources.yaml</text><text class="t-small" x="1090" y="143" text-anchor="end">Covers a whole repository in one line.</text><rect x="1041.6" y="150" width="48.4" height="19" rx="9" fill="var(--d-chip)" stroke="var(--d-lane-br)"/><text class="t-small" x="1065.8" y="164" text-anchor="middle" font-weight="700">free</text><rect x="96" y="186" width="1010" height="58" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.5"/><circle cx="126" cy="215.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="126" y="219.0" text-anchor="middle">2</text><text class="t-title" x="152" y="211" fill="var(--d-data-tx)">Folder path rules</text><text class="t-small" x="152" y="231">config/classification/path-rules.yaml  ·  glob → facets + ACL</text><text class="t-small" x="1090" y="211" text-anchor="end">hr/** → department HR;  */emea/** → region EMEA.</text><rect x="1041.6" y="218" width="48.4" height="19" rx="9" fill="var(--d-chip)" stroke="var(--d-lane-br)"/><text class="t-small" x="1065.8" y="232" text-anchor="middle" font-weight="700">free</text><rect x="96" y="254" width="1010" height="58" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.5"/><circle cx="126" cy="283.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="126" y="287.0" text-anchor="middle">3</text><text class="t-title" x="152" y="279" fill="var(--d-data-tx)">Sidecar file</text><text class="t-small" x="152" y="299">&lt;file&gt;.meta.json next to the document</text><text class="t-small" x="1090" y="279" text-anchor="end">For the handful of exceptions.</text><rect x="1041.6" y="286" width="48.4" height="19" rx="9" fill="var(--d-chip)" stroke="var(--d-lane-br)"/><text class="t-small" x="1065.8" y="300" text-anchor="middle" font-weight="700">free</text><rect x="96" y="322" width="1010" height="58" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.5"/><circle cx="126" cy="351.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="126" y="355.0" text-anchor="middle">4</text><text class="t-title" x="152" y="347" fill="var(--d-data-tx)">Manifest</text><text class="t-small" x="152" y="367">manifest.csv at the source root  ·  SMEs edit it in Excel</text><text class="t-small" x="1090" y="347" text-anchor="end">path, facet.&lt;name&gt;, acl.&lt;name&gt; — ';' separates values.</text><rect x="1041.6" y="354" width="48.4" height="19" rx="9" fill="var(--d-chip)" stroke="var(--d-lane-br)"/><text class="t-small" x="1065.8" y="368" text-anchor="middle" font-weight="700">free</text><rect x="96" y="390" width="1010" height="58" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.5"/><circle cx="126" cy="419.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="126" y="423.0" text-anchor="middle">5</text><text class="t-title" x="152" y="415" fill="var(--d-data-tx)">Upload form</text><text class="t-small" x="152" y="435">facets chosen by the uploader  ·  ACL from their own attributes</text><text class="t-small" x="1090" y="415" text-anchor="end">The only layer folder rules cannot reach.</text><rect x="1041.6" y="422" width="48.4" height="19" rx="9" fill="var(--d-chip)" stroke="var(--d-lane-br)"/><text class="t-small" x="1065.8" y="436" text-anchor="middle" font-weight="700">free</text><rect x="96" y="458" width="1010" height="58" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.5"/><circle cx="126" cy="487.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="126" y="491.0" text-anchor="middle">6</text><text class="t-title" x="152" y="483" fill="var(--d-ingest-tx)">Embedding classifier</text><text class="t-small" x="152" y="503">facets marked classify: true in facets.yaml</text><text class="t-small" x="1090" y="483" text-anchor="end">Reuses the chunk vectors the self-hosted model already produced.</text><rect x="1008.6" y="490" width="81.4" height="19" rx="9" fill="var(--d-chip)" stroke="var(--d-lane-br)"/><text class="t-small" x="1049.3" y="504" text-anchor="middle" font-weight="700">no tokens</text><rect x="96" y="526" width="1010" height="58" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.5"/><circle cx="126" cy="555.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="126" y="559.0" text-anchor="middle">7</text><text class="t-title" x="152" y="551" fill="var(--d-ingest-tx)">LLM classifier (optional)</text><text class="t-small" x="152" y="571">CLASSIFIER=embedding+llm  ·  only when the top two are close</text><text class="t-small" x="1090" y="551" text-anchor="end">Capped by CLASSIFIER_LLM_TOKEN_BUDGET.</text><rect x="1021.8" y="558" width="68.19999999999999" height="19" rx="9" fill="var(--d-chip)" stroke="var(--d-lane-br)"/><text class="t-small" x="1055.9" y="572" text-anchor="middle" font-weight="700">bounded</text><rect x="1140" y="234" width="264" height="98" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="1272.0" y="261.0" text-anchor="middle" fill="var(--d-sec-tx)">SME review queue</text><text class="t-line" x="1272.0" y="284.0" text-anchor="middle">anything the classifier is</text><text class="t-line" x="1272.0" y="301.0" text-anchor="middle">unsure about waits here</text><text class="t-line" x="1272.0" y="318.0" text-anchor="middle">(/admin → Review queue)</text><path class="edge" d="M1106 555 L1128 555 L1128 283.0 L1140 283.0" marker-end="url(#arrow)"/><text class="t-small" x="1272.0" y="222" text-anchor="middle" font-weight="700">low confidence goes here</text><rect x="1140" y="392" width="264" height="98" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="1272.0" y="419.0" text-anchor="middle" fill="var(--d-sec-tx)">Approved label</text><text class="t-line" x="1272.0" y="442.0" text-anchor="middle">becomes a new example, so</text><text class="t-line" x="1272.0" y="459.0" text-anchor="middle">the classifier improves and</text><text class="t-line" x="1272.0" y="476.0" text-anchor="middle">rules never overwrite it</text><path class="edge" d="M1272.0 332 L1272.0 392" marker-end="url(#arrow)"/><rect x="1140" y="548" width="264" height="98" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="1272.0" y="575.0" text-anchor="middle" fill="var(--d-data-tx)">Index fields</text><text class="t-line" x="1272.0" y="598.0" text-anchor="middle">f_department · f_region</text><text class="t-line" x="1272.0" y="615.0" text-anchor="middle">f_doc_type · f_topic</text><text class="t-line" x="1272.0" y="632.0" text-anchor="middle">f_confidentiality · f_language</text><rect x="96" y="606" width="1010" height="64" rx="10" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.6"/><text class="t-title" x="601.0" y="633.0" text-anchor="middle" fill="var(--d-obs-tx)">Result stored with every chunk</text><text class="t-line" x="601.0" y="656.0" text-anchor="middle">facet values (hierarchical facets also carry their ancestors, so filtering on EMEA finds UK documents)   ·   ACL values   ·   provenance per facet</text><rect x="36" y="716" width="1368" height="96.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-title" x="52" y="741.0" fill="var(--d-text)" font-size="13">Conventions that make layers 1–4 do most of the work</text><text class="t-line" x="52" y="759.0">Recommended folder convention:   &lt;source root&gt;/&lt;department&gt;/&lt;region&gt;/&lt;doc type&gt;/&lt;file&gt;      for example   hr/uk/policies/parental-leave-policy.md</text><text class="t-line" x="52" y="776.0">The parser contributes the title only (author and dates are read but set no facet); language comes from the source default. Access facets (department, region, confidentiality) also drive the policy; business facets (document type, topic) drive filtering and navigation.</text><text class="t-line" x="52" y="793.0">Provenance is kept for every facet — manifest, path_rule:&lt;glob&gt;, sidecar, classifier:&lt;method&gt; with its confidence, or review:&lt;user&gt; — and is visible in /admin.</text><rect x="36" y="878" width="16" height="13" rx="4" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.4"/><text class="t-small" x="60" y="888">Rule-based layer (free)</text><rect x="336" y="878" width="16" height="13" rx="4" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.4"/><text class="t-small" x="360" y="888">Automatic classification</text><rect x="636" y="878" width="16" height="13" rx="4" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.4"/><text class="t-small" x="660" y="888">Human decision</text><rect x="936" y="878" width="16" height="13" rx="4" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.4"/><text class="t-small" x="960" y="888">Stored on every chunk</text></svg>