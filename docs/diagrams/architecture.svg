  svg.ragos-diagram .lifeline{stroke:var(--d-edge);stroke-width:1.6;stroke-dasharray:5 5;}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker></defs><rect width="1440" height="1062" fill="var(--d-bg)"/><text class="t-head" x="36" y="44" text-anchor="start">RAG-OS system architecture</text><text class="t-small" x="36" y="64">Container Apps environment cae-ragos-dev · every app and job authenticates with the user-assigned managed identity id-ragos-dev (no keys, no connection strings)</text><rect class="lane" x="36" y="84" width="1076" height="262" rx="14"/><text class="t-lane" x="54" y="108">QUERY PATH</text><text class="t-small" x="54" y="126">workload profile: query (Dedicated D4)</text><rect class="lane" x="36" y="364" width="1076" height="350" rx="14"/><text class="t-lane" x="54" y="388">INGESTION PATH</text><text class="t-small" x="54" y="406">workload profiles: ingest (Dedicated D8) + Consumption-GPU-NC8as-T4</text><rect class="lane" x="1136" y="84" width="268" height="630" rx="14"/><text class="t-lane" x="1154" y="108">DATA &amp; AI SERVICES</text><rect x="62" y="156" width="222" height="81" rx="10" fill="var(--d-ext-bg)" stroke="var(--d-ext-br)" stroke-width="1.6"/><text class="t-title" x="173.0" y="183.0" text-anchor="middle" fill="var(--d-ext-tx)">Browser</text><text class="t-line" x="173.0" y="206.0" text-anchor="middle">signed in with Entra ID</text><text class="t-line" x="173.0" y="223.0" text-anchor="middle">MSAL · code + PKCE</text><rect x="330" y="156" width="222" height="98" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="441.0" y="183.0" text-anchor="middle" fill="var(--d-query-tx)">rag-chat-ui</text><text class="t-line" x="441.0" y="206.0" text-anchor="middle">nginx · CSP · /api proxy</text><text class="t-line" x="441.0" y="223.0" text-anchor="middle">EXTERNAL ingress :8080</text><text class="t-line" x="441.0" y="240.0" text-anchor="middle">1–3 replicas</text><rect x="596" y="156" width="222" height="98" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="707.0" y="183.0" text-anchor="middle" fill="var(--d-query-tx)">rag-api</text><text class="t-line" x="707.0" y="206.0" text-anchor="middle">FastAPI · access policy</text><text class="t-line" x="707.0" y="223.0" text-anchor="middle">INTERNAL ingress :8000</text><text class="t-line" x="707.0" y="240.0" text-anchor="middle">min 2 · max 10 replicas</text><rect x="866" y="156" width="222" height="81" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="977.0" y="183.0" text-anchor="middle" fill="var(--d-query-tx)">rag-embed-query</text><text class="t-line" x="977.0" y="206.0" text-anchor="middle">TEI 1.9 · Qwen3-Embedding</text><text class="t-line" x="977.0" y="223.0" text-anchor="middle">CPU · :80 · 1–4 · tei only</text><rect x="62" y="428" width="222" height="98" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="173.0" y="455.0" text-anchor="middle" fill="var(--d-ingest-tx)">Document sources</text><text class="t-line" x="173.0" y="478.0" text-anchor="middle">local_folder · azure_blob</text><text class="t-line" x="173.0" y="495.0" text-anchor="middle">upload · (SharePoint, Drive,</text><text class="t-line" x="173.0" y="512.0" text-anchor="middle">FTP registered as stubs)</text><rect x="330" y="428" width="222" height="98" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="441.0" y="455.0" text-anchor="middle" fill="var(--d-ingest-tx)">rag-scheduler</text><text class="t-line" x="441.0" y="478.0" text-anchor="middle">Container Apps job</text><text class="t-line" x="441.0" y="495.0" text-anchor="middle">cron */5 · discovery +</text><text class="t-line" x="441.0" y="512.0" text-anchor="middle">reconciliation</text><path d="M596 443 a111.0 11 0 0 1 222 0 v76 a111.0 11 0 0 1 -222 0 z" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><path d="M596 443 a111.0 11 0 0 0 222 0" fill="none" stroke="var(--d-data-br)" stroke-width="1.2" opacity=".65"/><text class="t-title" x="707.0" y="463.0" text-anchor="middle" fill="var(--d-data-tx)">Service Bus</text><text class="t-line" x="707.0" y="486.0" text-anchor="middle">ingest-priority (uploads)</text><text class="t-line" x="707.0" y="503.0" text-anchor="middle">ingest-bulk (backfills)</text><text class="t-line" x="707.0" y="520.0" text-anchor="middle">dead-letter after 5 tries</text><rect x="866" y="428" width="222" height="98" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="977.0" y="455.0" text-anchor="middle" fill="var(--d-ingest-tx)">rag-ingest-worker</text><text class="t-line" x="977.0" y="478.0" text-anchor="middle">KEDA azure-servicebus</text><text class="t-line" x="977.0" y="495.0" text-anchor="middle">0..10 replicas × 4 docs</text><text class="t-line" x="977.0" y="512.0" text-anchor="middle">parse · chunk · classify</text><path d="M330 611 a111.0 11 0 0 1 222 0 v59 a111.0 11 0 0 1 -222 0 z" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><path d="M330 611 a111.0 11 0 0 0 222 0" fill="none" stroke="var(--d-data-br)" stroke-width="1.2" opacity=".65"/><text class="t-title" x="441.0" y="631.0" text-anchor="middle" fill="var(--d-data-tx)">Blob Storage</text><text class="t-line" x="441.0" y="654.0" text-anchor="middle">raw-docs · config · exports</text><text class="t-line" x="441.0" y="671.0" text-anchor="middle">shared keys disabled</text><rect x="866" y="600" width="222" height="81" rx="10" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.6"/><text class="t-title" x="977.0" y="627.0" text-anchor="middle" fill="var(--d-ingest-tx)">rag-embed-ingest</text><text class="t-line" x="977.0" y="650.0" text-anchor="middle">TEI turing · NVIDIA T4 GPU</text><text class="t-line" x="977.0" y="667.0" text-anchor="middle">0..4 · scale to zero · tei only</text><rect x="1154" y="122" width="232" height="81" rx="10" fill="var(--d-ai-bg)" stroke="var(--d-ai-br)" stroke-width="1.6"/><text class="t-title" x="1270.0" y="149.0" text-anchor="middle" fill="var(--d-ai-tx)">Microsoft Foundry</text><text class="t-line" x="1270.0" y="172.0" text-anchor="middle">aif-ragos-dev / proj-ragos-dev</text><text class="t-line" x="1270.0" y="189.0" text-anchor="middle">claude-opus-5 · gpt-5-mini</text><path d="M1154 263 a116.0 11 0 0 1 232 0 v93 a116.0 11 0 0 1 -232 0 z" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><path d="M1154 263 a116.0 11 0 0 0 232 0" fill="none" stroke="var(--d-data-br)" stroke-width="1.2" opacity=".65"/><text class="t-title" x="1270.0" y="283.0" text-anchor="middle" fill="var(--d-data-tx)">Azure AI Search S1</text><text class="t-line" x="1270.0" y="306.0" text-anchor="middle">srch-ragos-dev · 2 replicas</text><text class="t-line" x="1270.0" y="323.0" text-anchor="middle">index kb-&lt;domain&gt;-&lt;fp&gt;</text><text class="t-line" x="1270.0" y="340.0" text-anchor="middle">hybrid + semantic ranker</text><text class="t-line" x="1270.0" y="357.0" text-anchor="middle">int8 · ACL + facet fields</text><path d="M1154 459 a116.0 11 0 0 1 232 0 v76 a116.0 11 0 0 1 -232 0 z" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><path d="M1154 459 a116.0 11 0 0 0 232 0" fill="none" stroke="var(--d-data-br)" stroke-width="1.2" opacity=".65"/><text class="t-title" x="1270.0" y="479.0" text-anchor="middle" fill="var(--d-data-tx)">PostgreSQL Flexible</text><text class="t-line" x="1270.0" y="502.0" text-anchor="middle">psql-ragos-dev · Entra-only</text><text class="t-line" x="1270.0" y="519.0" text-anchor="middle">document state · runs</text><text class="t-line" x="1270.0" y="536.0" text-anchor="middle">report read by rag-api</text><rect x="1154" y="596" width="232" height="98" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="1270.0" y="623.0" text-anchor="middle" fill="var(--d-sec-tx)">Key Vault</text><text class="t-line" x="1270.0" y="646.0" text-anchor="middle">dev-jwt-signing-key</text><text class="t-line" x="1270.0" y="663.0" text-anchor="middle">appinsights-connection</text><text class="t-line" x="1270.0" y="680.0" text-anchor="middle">read via keyvaultref</text><path class="edge" d="M284 196.5 L330 205.0" marker-end="url(#arrow)"/><circle cx="307.0" cy="176.5" r="11" fill="var(--d-badge)"/><text class="t-badge" x="307.0" y="180.5" text-anchor="middle">1</text><path class="edge" d="M552 205.0 L596 205.0" marker-end="url(#arrow)"/><circle cx="574.0" cy="185.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="574.0" y="189.0" text-anchor="middle">2</text><circle cx="618" cy="178" r="11" fill="var(--d-badge)"/><text class="t-badge" x="618" y="182" text-anchor="middle">3</text><path class="edge" d="M818 205.0 L866 196.5" marker-end="url(#arrow)"/><circle cx="842.0" cy="185.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="842.0" y="189.0" text-anchor="middle">4</text><text class="t-small" x="842.0" y="231.0" text-anchor="middle">embed query</text><path class="edge" d="M747.0 254 L747.0 312 L1120 312 L1120 275.5 L1154 275.5" marker-end="url(#arrow)"/><rect class="chip" x="820.485" y="301.0" width="288.68" height="21" rx="7"/><text class="t-edge" x="964.825" y="316.0" text-anchor="middle">hybrid query + ACL filter inside the query</text><circle cx="765.0" cy="274" r="11" fill="var(--d-badge)"/><text class="t-badge" x="765.0" y="278" text-anchor="middle">5</text><path class="edge" d="M667.0 156 L667.0 128 L1120 128 L1120 162.5 L1154 162.5" marker-end="url(#arrow)"/><rect class="chip" x="806.56" y="117.0" width="236.36" height="21" rx="7"/><text class="t-edge" x="924.74" y="132.0" text-anchor="middle">grounded prompt + numbered context</text><circle cx="649.0" cy="136" r="11" fill="var(--d-badge)"/><text class="t-badge" x="649.0" y="140" text-anchor="middle">6</text><path class="edge" d="M284 477.0 L330 477.0" marker-end="url(#arrow)"/><circle cx="307.0" cy="457.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="307.0" y="461.0" text-anchor="middle">7</text><path class="edge" d="M552 477.0 L596 481.0" marker-end="url(#arrow)"/><circle cx="574.0" cy="457.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="574.0" y="461.0" text-anchor="middle">8</text><path class="edge" d="M818 481.0 L866 477.0" marker-end="url(#arrow)"/><circle cx="842.0" cy="461.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="842.0" y="465.0" text-anchor="middle">9</text><path class="edge" d="M441.0 526 L441.0 576 L441.0 600" marker-end="url(#arrow)"/><rect class="chip" x="398.03" y="559.4" width="85.94000000000001" height="21" rx="7"/><text class="t-edge" x="441.0" y="574.4" text-anchor="middle">stage bytes</text><path class="edge" d="M552 640.5 L578 640.5 L578 566 L917.0 566 L917.0 526" marker-end="url(#arrow)"/><rect class="chip" x="715.9099999999999" y="555.0" width="79.4" height="21" rx="7"/><text class="t-edge" x="755.6099999999999" y="570.0" text-anchor="middle">read bytes</text><path class="edge" d="M1037.0 526 L1037.0 600" marker-end="url(#arrow)"/><rect class="chip" x="990.76" y="560.88" width="92.48" height="21" rx="7"/><text class="t-edge" x="1037.0" y="575.88" text-anchor="middle">embed chunks</text><circle cx="1037.0" cy="546" r="11" fill="var(--d-badge)"/><text class="t-badge" x="1037.0" y="550" text-anchor="middle">10</text><path class="edge" d="M1088 453.0 L1122 453.0 L1122 353.5 L1154 353.5" marker-end="url(#arrow)"/><rect class="chip" x="1072.49" y="423.04" width="99.02000000000001" height="21" rx="7"/><text class="t-edge" x="1122.0" y="438.04" text-anchor="middle">upsert chunks</text><circle cx="1106" cy="429.0" r="11" fill="var(--d-badge)"/><text class="t-badge" x="1106" y="433.0" text-anchor="middle">11</text><path class="edge" d="M1088 503.0 L1130 503.0 L1130 487.0 L1154 487.0" marker-end="url(#arrow)"/><rect class="chip" x="1053.2900000000002" y="492.0" width="125.18" height="21" rx="7"/><text class="t-edge" x="1115.88" y="507.0" text-anchor="middle">state transitions</text><rect x="36" y="742" width="1368" height="81" rx="10" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.6"/><text class="t-title" x="720.0" y="769.0" text-anchor="middle" fill="var(--d-obs-tx)">Application Insights + Log Analytics   (appi-ragos-dev · log-ragos-dev)</text><text class="t-line" x="720.0" y="792.0" text-anchor="middle">Every app and job exports OpenTelemetry traces, logs and metrics. One X-Correlation-ID follows a request from the browser through the API,</text><text class="t-line" x="720.0" y="809.0" text-anchor="middle">onto the queue message and into the worker.   Metrics: rag.tokens · rag.stage.duration · rag.ingest.docs   ·   KQL in docs/kql.md</text><rect x="36" y="852" width="770" height="147.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-title" x="52" y="877.0" fill="var(--d-text)" font-size="13">Answering a question</text><text class="t-line" x="52" y="895.0">1  The user signs in with Microsoft; MSAL acquires an access token for the RAG-OS API scope.</text><text class="t-line" x="52" y="912.0">2  The page calls /api/* with that token; nginx adds X-Correlation-ID and proxies to the internal API.</text><text class="t-line" x="52" y="929.0">3  rag-api validates issuer/algorithm/audience/expiry and maps the claims to the caller's attributes.</text><text class="t-line" x="52" y="946.0">4  The question is embedded by rag-embed-query (tei only), or by Foundry text-embedding-3-small (aoai only).</text><text class="t-line" x="52" y="963.0">5  Hybrid + semantic search runs with the access filter INSIDE the query (never a filter afterwards).</text><text class="t-line" x="52" y="980.0">6  Claude or GPT answers from the numbered passages; citations and token usage come back with the answer.</text><rect x="824" y="852" width="580" height="130.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-title" x="840" y="877.0" fill="var(--d-text)" font-size="13">Ingesting a document</text><text class="t-line" x="840" y="895.0">7   Scheduler lists each due source and detects what changed (etag / content hash).</text><text class="t-line" x="840" y="912.0">8   Changed documents are staged to Blob and enqueued as claim-check messages.</text><text class="t-line" x="840" y="929.0">9   KEDA scales workers on queue length; the priority lane is drained first.</text><text class="t-line" x="840" y="946.0">10  Chunks are embedded on the GPU pool (tei only); facets come from those vectors.</text><text class="t-line" x="840" y="963.0">11  New chunks are upserted, the previous version is deleted, and the state is recorded.</text><rect x="36" y="1026" width="16" height="13" rx="4" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.4"/><text class="t-small" x="60" y="1036">Query path</text><rect x="264" y="1026" width="16" height="13" rx="4" fill="var(--d-ingest-bg)" stroke="var(--d-ingest-br)" stroke-width="1.4"/><text class="t-small" x="288" y="1036">Ingestion path</text><rect x="492" y="1026" width="16" height="13" rx="4" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.4"/><text class="t-small" x="516" y="1036">Data store / queue</text><rect x="720" y="1026" width="16" height="13" rx="4" fill="var(--d-ai-bg)" stroke="var(--d-ai-br)" stroke-width="1.4"/><text class="t-small" x="744" y="1036">AI service</text><rect x="948" y="1026" width="16" height="13" rx="4" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.4"/><text class="t-small" x="972" y="1036">Secrets</text><rect x="1176" y="1026" width="16" height="13" rx="4" fill="var(--d-ext-bg)" stroke="var(--d-ext-br)" stroke-width="1.4"/><text class="t-small" x="1200" y="1036">Outside RAG-OS</text></svg>