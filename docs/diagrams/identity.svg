<svg class="ragos-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1112" width="1440" height="1112" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Where a caller's attributes come from: token issuers, validation, claim mapping and the resulting principal"><title>Where a caller's attributes come from: token issuers, validation, claim mapping and the resulting principal</title><style>
  svg.ragos-diagram{
    --d-bg:#ffffff; --d-lane:#f8fafc; --d-lane-br:#e2e8f0; --d-lane-tx:#475569;
    --d-query-bg:#eef2ff; --d-query-br:#6366f1; --d-query-tx:#312e81;
    --d-ingest-bg:#fff7ed; --d-ingest-br:#f59e0b; --d-ingest-tx:#92400e;
    --d-data-bg:#f1f5f9; --d-data-br:#64748b; --d-data-tx:#1e293b;
    --d-ai-bg:#f5f3ff; --d-ai-br:#8b5cf6; --d-ai-tx:#5b21b6;
    --d-sec-bg:#ecfdf5; --d-sec-br:#10b981; --d-sec-tx:#065f46;
    --d-obs-bg:#f8fafc; --d-obs-br:#94a3b8; --d-obs-tx:#334155;
    --d-ext-bg:#ffffff; --d-ext-br:#0f172a; --d-ext-tx:#0f172a;
    --d-state-bg:#ffffff; --d-state-br:#334155; --d-state-tx:#0f172a;
    --d-bad-bg:#fef2f2; --d-bad-br:#ef4444; --d-bad-tx:#991b1b;
    --d-text:#0f172a; --d-muted:#475569; --d-edge:#64748b; --d-edge-tx:#334155;
    --d-chip:#ffffff; --d-badge:#0f172a; --d-badge-tx:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    svg.ragos-diagram{
      --d-bg:#0f172a; --d-lane:#111c33; --d-lane-br:#2a3a56; --d-lane-tx:#94a3b8;
      --d-query-bg:#1e1b4b; --d-query-br:#818cf8; --d-query-tx:#c7d2fe;
      --d-ingest-bg:#3b2a0c; --d-ingest-br:#fbbf24; --d-ingest-tx:#fde68a;
      --d-data-bg:#1c2942; --d-data-br:#94a3b8; --d-data-tx:#e2e8f0;
      --d-ai-bg:#2e1065; --d-ai-br:#a78bfa; --d-ai-tx:#ddd6fe;
      --d-sec-bg:#052e26; --d-sec-br:#34d399; --d-sec-tx:#a7f3d0;
      --d-obs-bg:#172033; --d-obs-br:#94a3b8; --d-obs-tx:#cbd5e1;
      --d-ext-bg:#0b1220; --d-ext-br:#cbd5e1; --d-ext-tx:#e2e8f0;
      --d-state-bg:#111c33; --d-state-br:#94a3b8; --d-state-tx:#e2e8f0;
      --d-bad-bg:#3f1d1d; --d-bad-br:#f87171; --d-bad-tx:#fecaca;
      --d-text:#e2e8f0; --d-muted:#94a3b8; --d-edge:#94a3b8; --d-edge-tx:#cbd5e1;
      --d-chip:#0f172a; --d-badge:#e2e8f0; --d-badge-tx:#0f172a;
    }
  }
  svg.ragos-diagram text{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  svg.ragos-diagram .t-title{font-size:15px;font-weight:650;}
  svg.ragos-diagram .t-line{font-size:12.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-small{font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .t-lane{font-size:12.5px;font-weight:700;letter-spacing:.06em;fill:var(--d-lane-tx);}
  svg.ragos-diagram .t-edge{font-size:12px;fill:var(--d-edge-tx);}
  svg.ragos-diagram .t-badge{font-size:11.5px;font-weight:700;fill:var(--d-badge-tx);}
  svg.ragos-diagram .t-head{font-size:17px;font-weight:700;fill:var(--d-text);}
  svg.ragos-diagram .edge{fill:none;stroke:var(--d-edge);stroke-width:1.7;}
  svg.ragos-diagram .edge-dash{fill:none;stroke:var(--d-edge);stroke-width:1.5;stroke-dasharray:6 5;}
  svg.ragos-diagram .lane{fill:var(--d-lane);stroke:var(--d-lane-br);stroke-width:1.5;}
  svg.ragos-diagram .chip{fill:var(--d-chip);stroke:var(--d-lane-br);stroke-width:1;}
  svg.ragos-diagram .t-code{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:12.5px;fill:var(--d-text);}
  svg.ragos-diagram .t-codesm{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    font-size:11.5px;fill:var(--d-muted);}
  svg.ragos-diagram .lifeline{stroke:var(--d-edge);stroke-width:1.6;stroke-dasharray:5 5;}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--d-edge)"/></marker></defs><rect width="1440" height="1112" fill="var(--d-bg)"/><text class="t-head" x="36" y="44" text-anchor="start">Where a caller's attributes come from</text><text class="t-small" x="36" y="64">RAG-OS keeps no user records: every request is authorised from the claims in the caller's own Entra token. Access is granted in the directory — a group or an attribute — and nothing about a person is stored here.</text><rect x="36" y="96" width="664" height="115" rx="10" fill="var(--d-ext-bg)" stroke="var(--d-ext-br)" stroke-width="1.6"/><text class="t-title" x="368.0" y="123.0" text-anchor="middle" fill="var(--d-ext-tx)">Microsoft Entra ID</text><text class="t-line" x="368.0" y="146.0" text-anchor="middle">everyone who uses the assistant: employees, SMEs, admins</text><text class="t-line" x="368.0" y="163.0" text-anchor="middle">the chat UI signs in with MSAL (code + PKCE) → /auth/callback</text><text class="t-line" x="368.0" y="180.0" text-anchor="middle">RS256, signing keys from JWKS · aud: ENTRA_AUDIENCE</text><text class="t-line" x="368.0" y="197.0" text-anchor="middle">app roles (rag.admin) and group membership arrive as claims</text><rect x="36" y="224" width="664" height="104" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-small" x="52" y="244" font-weight="700">token claims Entra puts in the access token</text><text class="t-codesm" x="52" y="264">"groups": ["7c9f1b3e-…a001", "5b1e…c003"]</text><text class="t-codesm" x="52" y="280">"extn.region": ["UK"]</text><text class="t-codesm" x="52" y="296">"extn.clearance": 1</text><text class="t-codesm" x="52" y="312">"roles": ["rag.sme"]</text><path class="edge" d="M368.0 324 L368.0 352 L720 352"/><rect x="740" y="96" width="664" height="115" rx="10" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.6"/><text class="t-title" x="1072.0" y="123.0" text-anchor="middle" fill="var(--d-obs-tx)">Dev principals</text><text class="t-line" x="1072.0" y="146.0" text-anchor="middle">demos and CI only — so the product runs without a tenant</text><text class="t-line" x="1072.0" y="163.0" text-anchor="middle">config/dev/principals.yaml → POST /api/dev/token</text><text class="t-line" x="1072.0" y="180.0" text-anchor="middle">HS256 with dev-jwt-signing-key, lifetime capped at one hour</text><text class="t-line" x="1072.0" y="197.0" text-anchor="middle">only if DEV_AUTH_ENABLED=true ($false in Azure)</text><rect x="740" y="224" width="664" height="104" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-small" x="756" y="244" font-weight="700">the same shape of claims, read from the YAML fixture</text><text class="t-codesm" x="756" y="264">"departments": ["HR"]</text><text class="t-codesm" x="756" y="280">"regions": ["UK"]</text><text class="t-codesm" x="756" y="296">"clearance": 1</text><text class="t-codesm" x="756" y="312">"employee_id": "E1001"</text><path class="edge" d="M1072.0 324 L1072.0 352 L720 352"/><path class="edge" d="M720 352 L720 380" marker-end="url(#arrow)"/><text class="t-small" x="1404" y="344" text-anchor="end">one trusted-issuer table, composition.py</text><circle cx="394" cy="429" r="11" fill="var(--d-badge)"/><text class="t-badge" x="394" y="433" text-anchor="middle">1</text><rect x="370" y="380" width="700" height="98" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="720.0" y="407.0" text-anchor="middle" fill="var(--d-sec-tx)">JwtValidator</text><text class="t-line" x="720.0" y="430.0" text-anchor="middle">the algorithm is pinned per issuer — an unexpected alg, issuer or audience is rejected</text><text class="t-line" x="720.0" y="447.0" text-anchor="middle">signature, issuer, audience and expiry are checked before any claim is read</text><text class="t-line" x="720.0" y="464.0" text-anchor="middle">a dev token living longer than its configured cap is refused outright</text><circle cx="394" cy="555" r="11" fill="var(--d-badge)"/><text class="t-badge" x="394" y="559" text-anchor="middle">2</text><rect x="370" y="506" width="700" height="98" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="720.0" y="533.0" text-anchor="middle" fill="var(--d-sec-tx)">ClaimsMapper</text><text class="t-line" x="720.0" y="556.0" text-anchor="middle">the access policy decides which claim feeds which attribute, per issuer</text><text class="t-line" x="720.0" y="573.0" text-anchor="middle">value_map translates raw claim values — an Entra group object id becomes HR</text><text class="t-line" x="720.0" y="590.0" text-anchor="middle">roles are honoured only from issuers listed in trusted_for_roles</text><circle cx="394" cy="681" r="11" fill="var(--d-badge)"/><text class="t-badge" x="394" y="685" text-anchor="middle">3</text><rect x="370" y="632" width="700" height="98" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="720.0" y="659.0" text-anchor="middle" fill="var(--d-data-tx)">Principal</text><text class="t-line" x="720.0" y="682.0" text-anchor="middle">department=[HR]   region=[UK]   clearance=1   employee_id=[E1001]</text><text class="t-line" x="720.0" y="699.0" text-anchor="middle">roles={reviewer}   ·   subject=oid   ·   issuer_kind=entra</text><text class="t-line" x="720.0" y="716.0" text-anchor="middle">held for the length of one request — nothing is written to a database</text><path class="edge" d="M720 478 L720 506" marker-end="url(#arrow)"/><path class="edge" d="M720 604 L720 632" marker-end="url(#arrow)"/><path class="edge" d="M720 730 L720 758" marker-end="url(#arrow)"/><rect x="36" y="506" width="310" height="98" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-small" x="52" y="530" font-weight="700">value_map, in the policy</text><text class="t-codesm" x="52" y="552">value_map:</text><text class="t-codesm" x="52" y="568">  "7c9f1b3e-…a001": HR</text><text class="t-codesm" x="52" y="584">drop_unmapped: true</text><path class="edge-dash" d="M346 555 L370 555" marker-end="url(#arrow)"/><rect x="1094" y="506" width="310" height="98" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-small" x="1110" y="530" font-weight="700">Without a value_map</text><text class="t-small" x="1110" y="552">the claim value is used verbatim,</text><text class="t-small" x="1110" y="570">which is what you want for a</text><text class="t-small" x="1110" y="588">directory extension already set to HR.</text><path class="edge-dash" d="M1094 555 L1070 555" marker-end="url(#arrow)"/><rect x="36" y="758" width="1368" height="64" rx="10" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.6"/><text class="t-title" x="720.0" y="785.0" text-anchor="middle" fill="var(--d-query-tx)">These attributes become the search filter — Figure 8</text><text class="t-line" x="720.0" y="808.0" text-anchor="middle">the policy turns them into one OData filter that is part of every search, facet and listing query</text><rect x="36" y="846" width="436" height="98" rx="10" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.6"/><text class="t-title" x="254.0" y="873.0" text-anchor="middle" fill="var(--d-obs-tx)">Why principals.yaml exists</text><text class="t-line" x="254.0" y="896.0" text-anchor="middle">So the product can be demonstrated without</text><text class="t-line" x="254.0" y="913.0" text-anchor="middle">an identity provider. It is $false in Azure, and</text><text class="t-line" x="254.0" y="930.0" text-anchor="middle">never consulted for an Entra token.</text><rect x="504" y="846" width="436" height="98" rx="10" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.6"/><text class="t-title" x="722.0" y="873.0" text-anchor="middle" fill="var(--d-sec-tx)">Giving HR to 500 people</text><text class="t-line" x="722.0" y="896.0" text-anchor="middle">One Entra group, kb-dept-hr. Its object id</text><text class="t-line" x="722.0" y="913.0" text-anchor="middle">becomes HR through value_map, so documents</text><text class="t-line" x="722.0" y="930.0" text-anchor="middle">stay tagged HR. Membership change = next token.</text><rect x="972" y="846" width="436" height="98" rx="10" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.6"/><text class="t-title" x="1190.0" y="873.0" text-anchor="middle" fill="var(--d-data-tx)">clearance is a level, not a set</text><text class="t-line" x="1190.0" y="896.0" text-anchor="middle">0 Public · 1 Internal · 2 Confidential · 3 Restricted.</text><text class="t-line" x="1190.0" y="913.0" text-anchor="middle">A document is visible when acl_clearance &lt;= yours.</text><text class="t-line" x="1190.0" y="930.0" text-anchor="middle">It must arrive as an integer; untagged = denied.</text><rect x="36" y="966" width="1368" height="113.0" rx="10" fill="var(--d-lane)" stroke="var(--d-lane-br)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="t-title" x="52" y="991.0" fill="var(--d-text)" font-size="13">Two caveats worth knowing</text><text class="t-line" x="52" y="1009.0">Group overage — for a caller in more than ~150 groups Entra replaces the groups claim with _claim_names / _claim_sources, which RAG-OS does not</text><text class="t-line" x="52" y="1026.0">resolve. Apply a group filter on the app registration, or use a directory extension attribute instead.</text><text class="t-line" x="52" y="1043.0">Embedding — a host page passes an Entra access token acquired for the API scope through postMessage; RAG-OS never mints a token of its own,</text><text class="t-line" x="52" y="1060.0">and the origins allowed to do so are listed in EMBED_ORIGINS.</text><rect x="36" y="1090" width="16" height="13" rx="4" fill="var(--d-ext-bg)" stroke="var(--d-ext-br)" stroke-width="1.4"/><text class="t-small" x="60" y="1100">Token issuer (outside RAG-OS)</text><rect x="316" y="1090" width="16" height="13" rx="4" fill="var(--d-sec-bg)" stroke="var(--d-sec-br)" stroke-width="1.4"/><text class="t-small" x="340" y="1100">Identity handling in the API</text><rect x="596" y="1090" width="16" height="13" rx="4" fill="var(--d-data-bg)" stroke="var(--d-data-br)" stroke-width="1.4"/><text class="t-small" x="620" y="1100">Carried on the request</text><rect x="876" y="1090" width="16" height="13" rx="4" fill="var(--d-obs-bg)" stroke="var(--d-obs-br)" stroke-width="1.4"/><text class="t-small" x="900" y="1100">Local demo only</text><rect x="1156" y="1090" width="16" height="13" rx="4" fill="var(--d-query-bg)" stroke="var(--d-query-br)" stroke-width="1.4"/><text class="t-small" x="1180" y="1100">Continues in Figure 8</text></svg>